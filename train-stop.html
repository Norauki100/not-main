<html lang="ja"><head><meta charset="utf-8">

<title>停車チャレンジ</title>

.card{background:var(--panel);border-radius:10px;padding:8px 14px}
#dist{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}

#gr{font-weight:700;font-size:16px;white-space:nowrap}

#row{display:flex;align-items:baseline;gap:18px}
#spd{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
#notch{font-size:28px;font-weight:700;color:var(--amber);min-width:56px}
#bar{display:flex;gap:3px}
#bar i{width:18px;height:10px;border-radius:2px;background:#4a4553}
#bar i.on{background:var(--amber)}#bar i.b.on{background:var(--bad)}#bar i.n.on{background:#fff}
#top,#row,#bar,#warn{display:none!important}
#bot{background:none!important;align-items:flex-start!important}
#pad{display:flex;gap:10px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 22px;background:#34303d;color:var(--text);cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--amber)}
#pad button{min-width:130px}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,12,20,.72);padding:16px}
#ov .box{background:var(--panel);border-radius:14px;padding:22px 26px;max-width:420px;line-height:1.7}
#ov h1{margin:0 0 8px;font-size:26px}#ov p{margin:4px 0}
#ov .big{font-size:56px;font-weight:800;line-height:1}
#ov .go{background:var(--amber);color:#2b1a00;margin-top:12px}
#ov.dw{background:none;align-items:flex-start;padding-top:64px;pointer-events:none}#ov.dw .box{pointer-events:auto}

kbd{background:#34303d;border-radius:4px;padding:1px 6px}
</style></head><body>
<div id="top"><div class="card"><span id="dist">1200</span> m<span id="dl">停止位置まで</span></div><div class="card" id="gr">水平</div><div id="lim">60</div></div>
<div id="warn"></div>
<div id="bot"><div id="row"><div id="spd">0</div><div>km/h</div><div id="notch">N</div></div><div id="bar"></div>
<div id="pad"><button id="bUp">加速 ▼</button><button id="bDn">ブレーキ ▲</button></div></div>
<div id="ov"><div class="box"><h1>停車チャレンジ</h1>
<p>あさひ → みどり台 → さくら坂 の3駅を走ります。各駅のホームにある黄色い停止位置標識の真横に、先頭を止めてください。停車後は発車時刻になると発車できます(Enterでも発車)。</p>
<p><kbd>↓</kbd>/<kbd>S</kbd> 力行(加速)側へ1段　<kbd>↑</kbd>/<kbd>W</kbd> ブレーキ側へ1段　<kbd>Space</kbd> 非常ブレーキ　<kbd>R</kbd> やり直し</p>
<p>制限速度を超えるとATSが非常ブレーキをかけ、減点されます。ブレーキは効くまで少し遅れます。上り坂と下り坂もあります。</p>
<button class="go" id="start">出発する</button></div></div>

g.font='bold 54px sans-serif';g.fillStyle='#fff';g.fillText((Math.abs(d)<50?Math.abs(d).toFixed(1):Math.round(Math.abs(d)))+' m',372,112);
g.font='20px sans-serif';g.fillStyle='#9fc6e8';g.fillText('勾配',372,160);
g.font='bold 34px sans-serif';g.fillStyle=gv>0?'#ff8a80':gv<0?'#82b1ff':'#fff';g.fillText(gv>0?'上り '+gv+'‰':gv<0?'下り '+(-gv)+'‰':'水平',372,196);
g.fillStyle='#fff';g.beginPath();g.arc(572,196,38,0,7);g.fill();g.strokeStyle='#d62828';g.lineWidth=8;g.beginPath();g.arc(572,196,32,0,7);g.stroke();g.fillStyle='#111';g.textAlign='center';g.font='bold 30px sans-serif';g.fillText(lim,572,198);
if(s.mode==='run'&&(s.ats||over>1)){g.fillStyle=s.ats?'#d62828':'#e6a100';g.fillRect(0,H-32,W,32);g.fillStyle='#fff';g.font='bold 22px sans-serif';g.fillText(s.ats?'ATS 非常ブレーキ作動中':'制限速度超過',W/2,H-15)}
main.t.needsUpdate=true;drawSide();lv.rotation.x=s.n*.07}
// audio
let A=null;
const FM=(96/17)*4/(Math.PI*1.067)/3.6;   // モーター周波数(Hz) / 速度(km/h) ※OTOTETSU「名鉄1」: ギア96:17, 8極, 車輪径1067mm
const INV=[[0,8,440,450],[8,10,450,900],[10,35,900,900]];
function carrier(kmh){if(kmh>=35)return 5*FM*kmh;for(const[a,b,lo,hi]of INV)if(kmh<b)return lo+(hi-lo)*Math.max(0,(kmh-a)/(b-a));return 900}
const AX=[2,4.1,15.5,17.6,22,24.1,35.5,37.6];   // 運転台から各車軸までの距離(m)
function audio(){if(A)return;try{
A=new(window.AudioContext||window.webkitAudioContext)();const sr=A.sampleRate;
A.m=A.createGain();A.m.gain.value=.45;A.m.connect(A.destination);
const nb=A.createBuffer(1,sr*2,sr),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;A.nb=nb;
const nz=(type,freq,q)=>{const so=A.createBufferSource();so.buffer=nb;so.loop=true;const f=A.createBiquadFilter();f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;const g=A.createGain();g.gain.value=0;so.connect(f);f.connect(g);g.connect(A.m);so.start(0,Math.random()*1.5);return{f,g}};
A.run=nz('lowpass',250);A.sq=nz('bandpass',3000,3);A.air=nz('highpass',2200);
// モーター音: インバーターのPWM波形(正弦波と三角波の比較)を直接計算する
const P=A.mp={fm:0,fc:440,np:5,sync:false,m:0,g:0,gs:0,fs:440,ph:0,pc:0};
const sp=A.createScriptProcessor(2048,0,1);
sp.onaudioprocess=e=>{const o=e.outputBuffer.getChannelData(0);
for(let i=0;i<o.length;i++){P.gs+=(P.g-P.gs)*.0015;P.fs+=(P.fc-P.fs)*.004;
P.ph+=P.fm/sr;if(P.ph>=1)P.ph-=1;
let c;if(P.sync){c=(P.ph*P.np)%1}else{P.pc+=P.fs/sr;if(P.pc>=1)P.pc-=1;c=P.pc}
const tri=4*Math.abs(c-.5)-1,ref=P.m*Math.sin(6.2831853*P.ph);
o[i]=(ref>tri?1:-1)*P.gs}};
const hp=A.createBiquadFilter();hp.type='highpass';hp.frequency.value=250;
const lp=A.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;
const mg=A.createGain();mg.gain.value=.075;
sp.connect(hp);hp.connect(lp);lp.connect(mg);mg.connect(A.m);
A.pn=0;A.pm='ready';A.jit=1;A.jt=0;A.jk=null;
}catch(e){A=null}}
function beep(){if(!A)return;const o=A.createOscillator(),g=A.createGain();o.frequency.value=880;g.gain.value=.03;o.connect(g);g.connect(A.m);o.start();o.stop(A.currentTime+.12)}
function air(gn,dur){const t=A.currentTime,g=A.air.g.gain;g.cancelScheduledValues(t);g.setValueAtTime(gn,t);g.exponentialRampToValueAtTime(.0005,t+dur)}
function clack(v){const t=A.currentTime,b=A.createBufferSource();b.buffer=A.nb;const f=A.createBiquadFilter();f.type='bandpass';f.frequency.value=450+Math.random()*250;f.Q.value=.8;const g=A.createGain();g.gain.setValueAtTime(.4*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);b.connect(f);f.connect(g);g.connect(A.m);b.start(t,Math.random()*1.5,.2);
const o=A.createOscillator(),og=A.createGain();o.type='triangle';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(70,t+.2);og.gain.setValueAtTime(.6*v,t);og.gain.exponentialRampToValueAtTime(.001,t+.24);o.connect(og);og.connect(A.m);o.start(t);o.stop(t+.3)}
function audioUpdate(){
const kmh=s.v*3.6,run=s.mode==='run',t=A.currentTime,P=A.mp;
A.run.g.gain.setTargetAtTime(Math.min(.16,s.v/30*.16),t,.1);A.run.f.frequency.setTargetAtTime(200+s.v*18,t,.1);
// モーター(力行 + 電気ブレーキ)。EB・ATS中は空気ブレーキのみ
const pw=run?s.pow/.9:0,regen=run&&!s.ats&&s.n>-8?Math.min(1,s.brk/.98)*Math.max(0,Math.min(1,(kmh-3)/8)):0;
P.g=Math.min(1,Math.max(pw,regen));P.m=Math.max(0,Math.min(1,.12+kmh/38));P.fm=FM*kmh;
if(kmh>=35){P.sync=true;P.np=5}else{P.sync=false;A.jt-=1;if(A.jt<=0){A.jit=1+(Math.random()-.5)*.012;A.jt=3}P.fc=carrier(kmh)*A.jit}
// ブレーキのきしみ(低速)
const sq=run&&s.brk>.25&&kmh>.5&&kmh<20?s.brk*(1-kmh/20):0;
A.sq.g.gain.setTargetAtTime(Math.min(.1,.1*sq),t,.08);A.sq.f.frequency.setTargetAtTime(2600+kmh*40,t,.1);
// ブレーキ弁の空気音
if(s.n!==A.pn){if(s.n<A.pn&&s.n<0)air(.1,.9);else if(s.n>A.pn&&A.pn<0)air(.16,1.8);A.pn=s.n}
if(A.pm==='run'&&(s.mode==='done'||s.mode==='dwell'))air(.22,2.4);A.pm=s.mode;
// レールのジョイント音(25mごと、各車軸が通過するたびに)
if(!run||s.v<.3||!A.jk){A.jk=AX.map(o=>Math.floor((s.z-o)/25))}
else AX.forEach((o,i)=>{const k=Math.floor((s.z-o)/25);if(k!==A.jk[i]){A.jk[i]=k;clack(Math.min(1,.35+s.v/25)/(1+o/15))}})}
// state
let s;
function reset(){s={z:0,v:0,n:0,pow:0,brk:0,t:0,ats:false,pen:0,pen0:0,moved:false,mode:'run',bt:0,tn:1,res:[]};$('ov').style.display='none';$('ov').className='';$('warn').style.display='none'}
s={z:0,v:0,n:0,pow:0,brk:0,t:0,ats:false,pen:0,pen0:0,moved:false,mode:'ready',bt:0,tn:1,res:[]};
const bar=$('bar');for(let k=0;k<13;k++){const i=document.createElement('i');i.className=k<8?'b':k===8?'n':'';bar.appendChild(i)}
const setN=n=>{if(s.mode==='run')s.n=Math.max(-8,Math.min(4,n))};
addEventListener('keydown',e=>{if(e.repeat)return;audio();const k=e.key;
if(k==='ArrowUp'||k==='w'||k==='W'){hold(-1);e.preventDefault()}
else if(k==='ArrowDown'||k==='s'||k==='S'){hold(1);e.preventDefault()}
else if(k===' '){setN(-8);e.preventDefault()}
else if(k==='r'||k==='R')reset();
else if(k==='Enter'){if(s.mode==='ready')reset();else depart()}});
let ht=null,hi=null;
function stopHold(){clearTimeout(ht);clearInterval(hi);ht=hi=null}
function hold(d){stopHold();setN(s.n+d);ht=setTimeout(()=>{hi=setInterval(()=>setN(s.n+d),110)},350)}
addEventListener('keyup',e=>{if(['ArrowUp','ArrowDown','w','W','s','S'].includes(e.key))stopHold()});
addEventListener('blur',stopHold);
for(const[id,d]of[['bUp',1],['bDn',-1]]){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();audio();hold(d)});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,stopHold))}
$('start').onclick=()=>{audio();reset()};
function judge(over){const i=s.tn,S=STN[i],err=s.z-S.z,a=Math.abs(err);let g,b;
if(over){g='D';b=0}else if(a<=.5){g='S';b=100}else if(a<=1){g='A';b=90}else if(a<=3){g='B';b=75}else if(a<=10){g='C';b=50}else{g='D';b=20}
const dl=s.t-ARR[i],late=Math.max(0,Math.round(dl-5)),pen=s.pen-s.pen0,sc=Math.max(0,b-pen-late);
const dt=dl<-.5?Math.round(-dl)+'秒早着':dl<=.5?'定刻':Math.round(dl)+'秒遅れ';
return{n:S.n,g,sc,pen,late,dt,over,msg:over?'ホームの端を越えてオーバーランしました':a<.05?'ぴったり停止位置です':`停止位置から ${a.toFixed(2)} m ${err<0?'手前':'先'}で停止`}}
function finish(over){const r=judge(over);s.res.push(r);s.v=0;
if(over||s.tn===STN.length-1){s.mode='done';
const tot=Math.round(s.res.reduce((x,y)=>x+y.sc,0)/(STN.length-1));
$('ov').className='';$('ov').innerHTML=`<div class="box"><div class="big">${r.g}</div><h1>${over?'オーバーラン':'終点に到着しました'}</h1>${s.res.map(x=>`<p><b>${x.n}</b>　${x.g}　${x.msg}／${x.dt}／ATS ${x.pen/10}回　→ ${x.sc}点</p>`).join('')}<p>合計 ${tot} 点(${STN.length-1}駅の平均${over?'・未到達は0点':''})</p><button class="go" id="again">もう一度走る</button></div>`;
$('ov').style.display='flex';$('again').onclick=reset;$('again').focus()}
else{s.mode='dwell';
$('ov').className='dw';$('ov').innerHTML=`<div class="box"><h1>${r.n} に停車 — ${r.g}</h1><p>${r.msg}</p><p>${r.dt}／ATS ${r.pen/10}回　→ ${r.sc}点</p><button class="go" id="dep">発車</button></div>`;
$('ov').style.display='flex';$('dep').onclick=depart}}
function depart(){if(s.mode!=='dwell'||s.t<DEP[s.tn])return;s.tn++;s.mode='run';s.moved=false;s.pen0=s.pen;$('ov').style.display='none';$('ov').className=''}
function size(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();cab.position.z=-Math.max(0,Math.min(1,(1.5/cam.aspect-1)*.5))}
addEventListener('resize',size);size();
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
if(s.mode==='run'){
const kmh=s.v*3.6,lim=limitAt(s.z),over=kmh-lim;
if(!s.ats&&over>5){s.ats=true;s.pen+=10}
if(s.ats&&kmh<lim-3)s.ats=false;
const tp=(s.ats||s.n<=0)?0:s.n*.225;
const tb=s.ats?1.2:s.n===-8?1.35:s.n<0?-s.n*.14:0;
s.pow+=(tp-s.pow)*(1-Math.exp(-dt/.5));
s.brk+=(tb-s.brk)*(1-Math.exp(-dt/(tb<=s.brk?.4:(s.ats||s.n===-8)?.3:.9)));
let a=s.pow-s.brk-9.8*gradeAt(s.z)-(.012+.00012*s.v*s.v);
s.v+=a*dt;if(s.v<0)s.v=0;
s.z+=s.v*dt;s.t+=dt;if(s.v>3)s.moved=true;
if(over>1){s.bt-=dt;if(s.bt<=0){beep();s.bt=.6}}
if(s.z>STN[s.tn].z+90)finish(true);
else if(s.moved&&s.v<.03){if(s.z>STN[s.tn].z-60){s.v=0;finish(false)}else s.moved=false}
}else if(s.mode==='dwell'){s.t+=dt;const wt=DEP[s.tn]-s.t,db=$('dep');if(db){db.disabled=wt>0;db.textContent=wt>0?'発車まで あと '+Math.ceil(wt)+' 秒':'発車する (Enter)'}}
const d=STN[s.tn].z-s.z;
$('dist').textContent=Math.abs(d)<50?Math.abs(d).toFixed(1):Math.round(Math.abs(d));
$('dl').textContent=d>=0?'停止位置まで':'停止位置を過ぎた';
$('spd').textContent=Math.round(s.v*3.6);
$('lim').textContent=limitAt(s.z);
const gv=Math.round(gradeAt(s.z)*1000);$('gr').textContent=gv>0?'上り '+gv+'‰':gv<0?'下り '+(-gv)+'‰':'水平';
$('notch').textContent=s.ats?'ATS':s.n>0?'P'+s.n:s.n===0?'N':s.n===-8?'EB':'B'+(-s.n);
[...bar.children].forEach((c,k)=>c.classList.toggle('on',k===s.n+8));
const w=$('warn'),ov=s.v*3.6-limitAt(s.z);
w.style.display=s.mode==='run'&&(s.ats||ov>1)?'block':'none';w.textContent=s.ats?'ATS 非常ブレーキ作動中':'制限速度超過';
if(A)audioUpdate();
const sw=s.v/25;
cam.position.set(Math.sin(s.z*.11)*.015*sw,2.7+Math.sin(s.z*.9)*.01*sw,s.z);
cam.lookAt(Math.sin(s.z*.05)*.2*sw,2.5,s.z+40);
drawMon();renderer.render(scene,cam)}
requestAnimationFrame(loop);
</script></body></html>
