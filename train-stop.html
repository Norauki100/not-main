<style>

const WST=[{n:'珀南',z:0,no:'01',en:'Hakunan'},{n:'新山北',z:1870,no:'02',en:'Shinyamakita'},{n:'北川',z:4010,no:'03',en:'Kitagawa'},{n:'青山港前',z:5970,no:'04',en:'Aoyamako mae'},

const GRF=[[700,-9],[1000,0],[2200,9],[2500,0],[2700,9],[3000,0],[3200,-9],[3500,0],[4500,-9],[4800,0],[5150,-9],[5400,0],[6250,9],[6850,0],[7400,-9],[7700,0],[7950,9],[8100,0],

const TUN=[[6700,7330],[7600,7880]];const inTun=z=>TUN.some(([a,b])=>z>a+4&&z<b-4);   // トンネル

const mirrorLim=(lim,base)=>{const Z=[[-1e9,base,'区間']].concat(lim),n=Z.length,r=[];for(let i=n-2;i>=0;i--)r.push([Z0-Z[i+1][0],Z[i][1],Z[i][2]]);return{list:r,base:Z[n-1][1]}};

// ---- 閉そく信号(下りは s、上りは p=Z0-s)。駅の出発信号・場内信号と、その間の閉そく信号 ----
const SIGF=[200,750,1350,2020,2600,3200,3700,4180,4800,5350,6130,6600,7250,7900,8530,9100,9700,10140,10900,11500,12050,12760,13350,14000,14520].map(z=>({z,a:'G'}));

CFG.t0=Math.max(21600,Math.min(82800,Math.round((+CFG.t0||27000)/1800)*1800));if(![2,4,6].includes(CFG.cars))CFG.cars=4;if(!['ln','lh','en','eh','free','walk'].includes(CFG.kind))CFG.kind='ln';CFG.wsp=Math.max(0,Math.min(7,CFG.wsp|0));CFG.sp=Math.max(0,Math.min(5,CFG.sp|0));CFG.event=!!CFG.event;
const saveCfg=()=>{try{localStorage.setItem('tsCfg1',JSON.stringify(CFG))}catch(_){}};

const ARRT={ln:[0,135,300,455,630,800,960,1145],lh:[0,145,315,480,650,810,965,1150],en:[0,205,450,605,865],eh:[0,230,385,630,880]},

fN:{key:'fN',type:'フリー',pre:'0F',lo:50,hi:99,dir:1,stops:[0,1,2,3,4,5,6,7],arr:[0,0,0,0,0,0,0,0],dep:[0,0,0,0,0,0,0,0],dest:'北川空港 方面',free:true},

ln:{key:'ln',type:'普通',pre:'1N',lo:1,hi:49,dir:1,stops:[0,1,2,3,4,5,6,7],arr:ARRT.ln,dep:DEPT.ln,dest:'北川空港 行'},
lh:{key:'lh',type:'普通',pre:'1H',lo:1,hi:49,dir:-1,stops:[7,6,5,4,3,2,1,0],arr:ARRT.lh,dep:DEPT.lh,dest:'珀南 行'},

const OPP={ln:'lh',lh:'ln',en:'eh',eh:'en'},TURN=['珀南','北川空港'];   // 折り返しの対応 / 折り返し設備のある駅
const trk=S=>S.no==='03'&&RT&&RT.trkN?String(RT.trkN):S.no==='01'&&RT&&RT.trk?String(RT.trk):S.no==='06'&&RT&&RT.trk2?String(RT.trk2):S.no==='08'&&RT&&RT.trkA?String(RT.trkA):(DIR>0?'2':'1');   // 番線
let STN=WST,ARR=[0,0],DEP=[0,0],LIM=LIMF,LIMBASE=60,GR=GRF,GBASE=0,SIG=SIGF,MAG=MAGF,DIR=1,RT=null;   // 現在の運転種別のデータ(ルート距離pで表す)

let PX=z=>TX,XACT=[],XACT45=[];   // 自列車の線路の左右位置(線路の中心線からの横ずれ、左が+)/ 渡り線の制限25区間・分岐の制限45区間(ルート距離)

const TX=5;   // 複線: 下り線は上り線の左5m
