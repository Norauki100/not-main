const tot=Math.round(s.res.reduce((x,y)=>x+y.sc,0)/(STN.length-1));
$('ov').className='';$('ov').innerHTML=`<div class="box"><div class="big">${r.g}</div><h1>${over?'オーバーラン':'終点に到着しました'}</h1>${s.res.map(x=>`<p><b>${x.n}</b>　${x.g}　${x.msg}／${x.dt}／ATS ${x.pen/10}回　→ ${x.sc}点</p>`).join('')}<p>合計 ${tot} 点(${STN.length-1}駅の平均${over?'・未到達は0点':''})</p><button class="go" id="again">もう一度走る</button></div>`;
$('ov').style.display='flex';$('again').onclick=reset;$('again').focus()}
else{s.mode='dwell';s.ats=false;s.rg=false;s.dw=0;
$('ov').className='dw';$('ov').innerHTML=`<div class="box"><h1>${r.n} に停車 — ${r.g}</h1><p>${r.msg}</p><p>${r.dt}／ATS ${r.pen/10}回　→ ${r.sc}点</p><p id="dwt" style="margin-top:8px;font-weight:700;color:var(--ok)"></p></div>`;
$('ov').style.display='flex'}}
function depart(){if(s.mode!=='dwell')return;s.tn++;s.mode='run';s.moved=false;s.pen0=s.pen;s.rg=false;$('ov').style.display='none';$('ov').className=''}
function size(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();cab.position.z=-Math.max(0,Math.min(1,(1.5/cam.aspect-1)*.5))}
addEventListener('resize',size);size();
let last=performance.now();
let swy=0,swv=0,swr=0,swrv=0,swq=0,swqv=0,acc=0,pv=0,pj=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
if(s.paused){}
else if(s.mode==='run'||s.mode==='dwell'){
const dw=s.mode==='dwell',kmh=s.v*3.6,lim=limitAt(s.z),over=kmh-lim;
if(!dw){if(!s.ats&&over>5){s.ats=true;s.pen+=10}
if(s.ats&&kmh<lim-3)s.ats=false}
const tp=(dw||s.ats||s.aeb||s.n<=0)?0:s.n*.225;
const tb=dw?Math.max(.6,s.n===-8?1.35:s.n<0?-s.n*.14:0):(s.ats||s.aeb)?1.2:s.n===-8?1.35:s.n<0?-s.n*.14:0;
s.pow+=(tp-s.pow)*(1-Math.exp(-dt/.5));
s.brk+=(tb-s.brk)*(1-Math.exp(-dt/(tb<=s.brk?.4:(s.ats||s.n===-8)?.3:.9)));
if(!s.clk&&!dw&&(s.n>0||s.v>.1))s.clk=true;   // 最初に力行した瞬間から時計が進む
if(s.clk)s.t+=dt;
if(dw){s.dw+=dt;const wt=DEP[s.tn]-s.t;
if(!s.rg&&wt<=0&&s.dw>=8){s.rg=true;s.rt=1.8;ring(1.4)}   // 発車時刻: 電鈴 → ドア閉 → 自動で発車可
if(s.rg){s.rt-=dt;if(s.rt<=0)depart()}
const e=$('dwt');if(e)e.textContent=s.rg?'ドアが閉まります':wt>0?'発車まで あと '+Math.ceil(wt)+' 秒':'まもなく発車します'}
else{
if(s.aws==='warn'){s.awsT-=dt;s.hb-=dt;if(s.hb<=0){horn();s.hb=.28}if(s.awsT<=0){s.aws='ack';s.aeb=true;s.pen+=10}}   // 8秒以内に確認しないとAWS非常ブレーキ
if(s.aeb&&(s.v<.03||kmh<40))s.aeb=false;
let a=s.pow-s.brk-9.8*gradeAt(s.z)-(.012+.00012*s.v*s.v);
s.v+=a*dt;if(s.v<0)s.v=0;
const z0=s.z;s.z+=s.v*dt;if(s.v>3)s.moved=true;for(const m of MAG)if(z0<m.zm&&s.z>=m.zm)awsHit(m);
if(s.ats||over>1){s.bt-=dt;if(s.bt<=0){beep();s.bt=s.ats?.4:.6}}else s.bt=0;
if(s.z>STN[s.tn].z+90)finish(true);
else if(s.moved&&s.v<.03){if(s.z>STN[s.tn].z-60){s.v=0;finish(false)}else s.moved=false}}
// 対向列車
if(ONC.on){ONC.z-=ONC.v*dt;if(ONC.z<s.z-140){ONC.on=false;ONC.cd=90+Math.random()*60}}
else{ONC.cd-=dt;if(ONC.cd<=0&&s.z<2650){ONC.on=true;ONC.z=s.z+480;ONC.v=18+Math.random()*8}}
ONC.g.visible=ONC.on;ONC.g.position.z=ONC.z}
const d=STN[s.tn].z-s.z;
$('dist').textContent=Math.abs(d)<50?Math.abs(d).toFixed(1):Math.round(Math.abs(d));
$('dl').textContent=d>=0?'停止位置まで':'停止位置を過ぎた';
$('spd').textContent=Math.round(s.v*3.6);
$('lim').textContent=limitAt(s.z);
const gv=Math.round(gradeAt(s.z)*1000);$('gr').textContent=gv>0?'上り '+gv+'‰':gv<0?'下り '+(-gv)+'‰':'水平';
$('notch').textContent=s.ats?'ATS':s.n>0?'P'+s.n:s.n===0?'N':s.n===-8?'EB':'B'+(-s.n);
[...bar.children].forEach((c,k)=>c.classList.toggle('on',k===s.n+8));
const w=$('warn'),ov=s.v*3.6-limitAt(s.z);
w.style.display=s.mode==='run'&&(s.ats||ov>1)?'block':'none';w.textContent=s.ats?'ATS 非常ブレーキ作動中':'制限速度超過';
if(A){A.m.gain.setTargetAtTime(s.paused||menuKind==='title'?0:masterVol(),A.currentTime,.05);if(!s.paused)audioUpdate()}
const sw=s.v/25;
const k=SHK/60;
if(!s.paused){const aN=dt>0?(s.v-pv)/dt:0;pv=s.v;acc+=(aN-acc)*Math.min(1,dt*3);
const kj=Math.floor(s.z/25);if(kj!==pj){pj=kj;if(s.v>1&&s.mode==='run'){const f=Math.min(1,s.v/20);swv-=.02*f*(.6+Math.random()*.8);swrv+=(Math.random()-.5)*.05*f;swqv+=(Math.random()-.5)*.04*f}}
swy+=swv*dt;swv+=(-110*swy-10*swv)*dt;swr+=swrv*dt;swrv+=(-70*swr-6*swrv)*dt;swq+=swqv*dt;swqv+=(-50*swq-5*swqv)*dt}
const amp=k*Math.min(1.4,sw);
const rl=(Math.sin(s.z*.27)*.5+Math.sin(s.z*.61+1.7)*.35)*.007*amp+swr*k;
const yw=(Math.sin(s.z*.23)*.5+Math.sin(s.z*.51+2)*.5)*.004*amp;
const lat=(Math.sin(s.z*.19)*.6+Math.sin(s.z*.43+.6)*.4)*.03*amp;
cam.position.set(lat,2.7+swy*k+Math.sin(s.z*.9)*.002*amp,s.z);
cam.lookAt(Math.sin(s.z*.05)*.2*Math.min(1.2,sw),2.5,s.z+40);
cam.rotateZ(rl);cam.rotateX(acc*.012*k+swy*k*1.5);cam.rotateY(yw+swq*k);
cab.rotation.z=-rl*.4;cab.position.y=-swy*k*.4;
drawMon();renderer.render(scene,cam)}
requestAnimationFrame(loop);
</script></body></html>
