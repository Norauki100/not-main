<!doctype html>
<html lang="ja"><head><meta charset="utf-8">

<title>停車チャレンジ</title>
<style>

#dist{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
#dl{font-size:12px;opacity:.8;display:block}

#warn{position:fixed;left:50%;top:92px;transform:translateX(-50%);background:var(--bad);color:#2a0606;font-weight:700;padding:6px 16px;border-radius:8px;display:none}
#bot{position:fixed;left:0;right:0;bottom:0;padding:18px 14px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(transparent,rgba(10,8,14,.88) 40%);display:flex;flex-direction:column;align-items:center;gap:8px}

#spd{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
#notch{font-size:28px;font-weight:700;color:var(--amber);min-width:56px}
#bar{display:flex;gap:3px}
#bar i{width:9px;height:10px;border-radius:2px;background:#4a4553}
#bar i.on{background:var(--amber)}#bar i.b.on{background:var(--bad)}#bar i.n.on{background:#fff}
#top,#row,#bar,#warn{display:none!important}

button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 22px;background:#34303d;color:var(--text);cursor:pointer;touch-action:manipulation}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translate(-50%,-12px);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;z-index:6;background:rgba(20,18,30,.9);color:#fff;border-radius:12px;padding:10px 16px;display:flex;gap:10px;align-items:center;font-size:15px;white-space:nowrap}

</style></head><body>

<script>

// ==== 駅の位置(珀南からの実際の距離 m) ====   駅を増やすときはここに1行足し、その駅の設備を「延伸区間」のところに作る
const LINE=[{n:'珀南',z:0},{n:'新山北',z:1870},{n:'北川',z:4010},{n:'青山港前',z:5970},{n:'吉浜',z:8380},{n:'吉浜中央',z:10550},{n:'南川',z:12610},{n:'北川空港',z:14890}];
// 珀南〜吉浜中央の景色・設備は「旧設計座標」(駅間1.1〜2.2km時代)で作り、完成後に実際の距離へ並べ直す。

const WKN=[];for(const[a,b,i]of UWIN){const sh=LINE[i].z-OLDZ[i];WKN.push([a,a+sh],[b,b+sh])}

const W=u=>pwl(WKN,u,0,1),Winv=z=>pwl(WKN,z,1,0);   // W: 旧設計座標 → 実際の位置 / Winv: その逆
const ZY=LINE[5].z,ZM=LINE[6].z,ZA=LINE[7].z;   // 吉浜中央・南川・北川空港(実際の位置)

const WST=[{n:'珀南',z:0,no:'01',en:'Hakunan'},{n:'新山北',z:1300,no:'02',en:'Shinyamakita'},{n:'北川',z:2500,no:'03',en:'Kitagawa'},{n:'青山港前',z:3650,no:'04',en:'Aoyamako mae'},{n:'吉浜',z:5850,no:'05',en:'Yoshihama'},{n:'吉浜中央',z:7850,no:'06',en:'Yoshihama-chuo'}];   // 世界(駅の建物など)の駅
let LIMF=[[500,120,''],[3950,90,''],[5900,100,'']];   // 線内最高120km/h。珀南(終着駅)は45km/h、新山北〜青山港前は制限なし   // 駅前の制限は無し

const mkMag=l=>l.map((g,i)=>({i,zm:g.z-300})).filter(m=>m.zm>20);   // AWS磁石(信号の300m手前)

// 逆方向データ: 世界のzを p=Z0-z に写す
const mirrorLim=(lim,base)=>{const Z=[[-1e9,base,'区間']].concat(lim),n=Z.length,r=[];for(let i=n-2;i>=0;i--)r.push([Z0-Z[i+1][0],Z[i][1],Z[i][2]]);return{list:r,base:Z[n-1][1]}};

// 運転種別
const VER='1.0.0';   // バージョン表記
const CFG=Object.assign({kind:'ln',sp:0,t0:27000,cars:4,event:false},(()=>{try{return JSON.parse(localStorage.getItem('tsCfg1'))||{}}catch(_){return{}}})());   // kind:ln/lh/en/eh/free  sp:フリードライブの開始地点  t0:出発時刻(秒)  cars:両数

const ARRT={ln:[0,150,315,465,640,810,970,1150],lh:[0,140,305,470,645,805,960,1125],en:[0,215,460,615,870],eh:[0,225,380,620,880]},
DEPT={ln:[0,180,345,495,670,840,1000,0],lh:[0,170,335,500,675,835,990,0],en:[0,240,485,640,0],eh:[0,250,405,645,0]};   // 制限速度と勾配どおりに走った時間に約8%の余裕を足し、5秒単位に切り上げ
const ROUTES={
fN:{key:'fN',type:'フリー',pre:'0F',lo:50,hi:99,dir:1,stops:[0,1,2,3,4,5,6,7],arr:[0,0,0,0,0,0,0,0],dep:[0,0,0,0,0,0,0,0],dest:'北川空港 方面',free:true},
fH:{key:'fH',type:'フリー',pre:'0F',lo:50,hi:99,dir:-1,stops:[7,6,5,4,3,2,1,0],arr:[0,0,0,0,0,0,0,0],dep:[0,0,0,0,0,0,0,0],dest:'珀南 方面',free:true},
ln:{key:'ln',type:'普通',pre:'1N',lo:1,hi:49,dir:1,stops:[0,1,2,3,4,5,6,7],arr:ARRT.ln,dep:DEPT.ln,dest:'北川空港 行'},
lh:{key:'lh',type:'普通',pre:'1H',lo:1,hi:49,dir:-1,stops:[7,6,5,4,3,2,1,0],arr:ARRT.lh,dep:DEPT.lh,dest:'珀南 行'},
en:{key:'en',type:'急行',pre:'3N',lo:50,hi:99,dir:1,stops:[0,2,4,5,7],arr:ARRT.en,dep:DEPT.en,dest:'北川空港 行'},
eh:{key:'eh',type:'急行',pre:'3H',lo:50,hi:99,dir:-1,stops:[7,5,4,2,0],arr:ARRT.eh,dep:DEPT.eh,dest:'珀南 行'}};
const OPP={ln:'lh',lh:'ln',en:'eh',eh:'en'},TURN=['珀南','北川空港'];   // 折り返しの対応 / 折り返し設備のある駅
const trk=S=>S.no==='03'&&RT&&RT.trkN?String(RT.trkN):S.no==='01'&&RT&&RT.trk?String(RT.trk):S.no==='06'&&RT&&RT.trk2?String(RT.trk2):S.no==='08'&&RT&&RT.trkA?String(RT.trkA):(DIR>0?'2':'1');   // 番線(下りは外側=2番線(珀南は3番線)、上りは1番線(珀南は2番線))
let STN=WST,ARR=[0,0],DEP=[0,0],LIM=LIMF,LIMBASE=60,GR=GRF,GBASE=0,SIG=SIGF,MAG=MAGF,DIR=1,RT=null;   // 現在の運転種別のデータ(ルート距離pで表す)
function newNum(){RT.num=RT.pre+String(RT.lo+Math.floor(Math.random()*(RT.hi-RT.lo+1))).padStart(2,'0')}
let PX=z=>TX,XACT=[],XACT45=[];   // 自列車の線路のx(曲線CXは別)/ 渡り線の制限25区間(ルート距離)
const SM=u=>u<=0?0:u>=1?1:u*u*(3-2*u),pick=a=>a[Math.floor(Math.random()*a.length)];
const EL0=6850,EHM=8,EL1=EL0+EHM/.012;let EH=z=>z<=EL0?0:z>=EL1?EHM:.012*(z-EL0);   // 高架: 吉浜の約1km先(6850m)から12‰で上り、8mの高さの高架になる(線路はy=0のまま、地面が下がる)
const STAB=[],stab=f=>{const n=scene.children.length;f();return scene.children.slice(n)};   // 留置線の編成(スポーン時に隠す)
const ISD=3.5;let ISH=z=>ISD*SM((z-1100)/150)*(1-SM((z-1400)/150));   // 新山北: 島式ホームのため両線が3.5mずつ外へ開く(1100〜1250で開き、1400〜1550で戻る)
// 珀南(H01)の番線: 吉浜方面を向いて右から 1番線=x-8.2 2番線=x0 3番線=x5 4番線=x13.2
const depPath4=[null,z=>-8.2+8.2*SM((z-140)/100)+5*SM((z-270)/100),z=>5*SM((z-270)/100),z=>5,z=>13.2-8.2*SM((z-140)/100)];   // 吉浜中央(2面4線)用
// 珀南(H01)は3面6線: 吉浜中央方面を向いて右から 1番線=x-21.4 2番線=x-13.2 3番線=x-8.2 4番線=x0 5番線=x5 6番線=x13.2(1-2番線:終着 3,6番線:普通 4,5番線:優等)
const ta1=z=>SM((z-100)/90),ta2=z=>SM((z-190)/90),ta3=z=>SM((z-280)/100),ta6=z=>SM((z-140)/100),tcx=z=>SM((z-390)/100);   // 合流はホーム端(z=90)より先から始める
let LPN=z=>SM((z-2300)/100)-SM((z-2650)/100);   // 北川の待避線(外側線)への分岐・合流
const depPath=[null,z=>-21.4+8.2*ta1(z)+5*ta2(z)+8.2*ta3(z)+5*tcx(z),z=>-13.2+5*ta2(z)+8.2*ta3(z)+5*tcx(z),z=>-8.2+8.2*ta3(z)+5*tcx(z),z=>5*tcx(z),z=>5,z=>13.2-8.2*ta6(z),z=>17.4-4.2*SM((z-40)/100)-8.2*ta6(z)];   // [7]=珀南の留置線(x=17.4)から6番線を経て本線へ   // 各番線から吉浜中央方面の本線(x=5)へ   // 各番線から吉浜方面の本線(x=5)へ
const arrPath4=[null,z=>-8.2+8.2*SM((z-140)/100),z=>0,z=>5*(1-SM((z-270)/100)),z=>5*(1-SM((z-270)/100))+8.2*(1-SM((z-140)/100)),z=>5*(1-SM((z-270)/100))+8.2*(1-SM((z-140)/100))+4.2*(1-SM((z-40)/100))];   // [5]=吉浜中央の留置線(x=17.4)から4番線を経て本線へ
const arrPath=[null,z=>-21.4+8.2*ta1(z)+5*ta2(z)+8.2*ta3(z),z=>-13.2+5*ta2(z)+8.2*ta3(z),z=>-8.2+8.2*ta3(z),z=>0,z=>5*(1-tcx(z)),z=>5*(1-tcx(z))+8.2*(1-ta6(z))];   // 本線(x=0)から各番線へ
