<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>停車チャレンジ</title>
<style>

#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.card{background:var(--panel);border-radius:10px;padding:8px 14px}
#dist{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
#dl{font-size:12px;opacity:.8;display:block}
#gr{font-weight:700;font-size:16px;white-space:nowrap}
#lim{width:64px;height:64px;border-radius:50%;background:#fff;border:7px solid #d62828;color:#111;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
#warn{position:fixed;left:50%;top:92px;transform:translateX(-50%);background:var(--bad);color:#2a0606;font-weight:700;padding:6px 16px;border-radius:8px;display:none}
#bot{position:fixed;left:0;right:0;bottom:0;padding:18px 14px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(transparent,rgba(10,8,14,.88) 40%);display:flex;flex-direction:column;align-items:center;gap:8px}
#row{display:flex;align-items:baseline;gap:18px}
#spd{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
#notch{font-size:28px;font-weight:700;color:var(--amber);min-width:56px}
#bar{display:flex;gap:3px}
#bar i{width:18px;height:10px;border-radius:2px;background:#4a4553}
#bar i.on{background:var(--amber)}#bar i.b.on{background:var(--bad)}#bar i.n.on{background:#fff}
#top,#row,#bar,#warn{display:none!important}
#bot{background:none!important;align-items:flex-start!important}
#pad{display:flex;gap:10px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 22px;background:#34303d;color:var(--text);cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--amber)}
#pad button{min-width:130px}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,12,20,.72);padding:16px}
#ov .box{background:var(--panel);border-radius:14px;padding:22px 26px;max-width:420px;line-height:1.7}
#ov h1{margin:0 0 8px;font-size:26px}#ov p{margin:4px 0}
#ov .big{font-size:56px;font-weight:800;line-height:1}
#ov .go{background:var(--amber);color:#2b1a00;margin-top:12px}
kbd{background:#34303d;border-radius:4px;padding:1px 6px}
</style></head><body>
<div id="top"><div class="card"><span id="dist">1200</span> m<span id="dl">停止位置まで</span></div><div class="card" id="gr">水平</div><div id="lim">60</div></div>
<div id="warn"></div>
<div id="bot"><div id="row"><div id="spd">0</div><div>km/h</div><div id="notch">N</div></div><div id="bar"></div>
<div id="pad"><button id="bUp">加速 ▼</button><button id="bDn">ブレーキ ▲</button></div></div>
<div id="ov"><div class="box"><h1>停車チャレンジ</h1>
<p>みどり台駅のホームにある黄色い停止位置標識の真横で、先頭を止めてください。</p>
<p><kbd>↓</kbd>/<kbd>S</kbd> 力行(加速)側へ1段　<kbd>↑</kbd>/<kbd>W</kbd> ブレーキ側へ1段　<kbd>Space</kbd> 非常ブレーキ　<kbd>R</kbd> やり直し</p>
<p>制限速度を超えるとATSが非常ブレーキをかけ、減点されます。ブレーキは効くまで少し遅れます。上り坂と下り坂もあります。</p>
<button class="go" id="start">出発する</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

for(let i=0;i<22;i++){const x=(rnd()<.5?-1:1)*(14+(rnd()<.5?-1.7:1.7)),z=rnd()*LEN,c=[0xb23a3a,0xe8e8ec,0x2f4f7a,0x23262b,0xc9b037][i%5];box(1.8,.8,4.2,c,x,.55,z);box(1.6,.6,2.2,0x1d2430,x,1.2,z-.2)}
for(let i=0;i<70;i++){const side=rnd()<.5?-1:1,h=6+rnd()*28,w=8+rnd()*12;box(w,h,8+rnd()*10,[0x3a3548,0x4a4458,0x575066,0x453a4a][i%4],side*(26+rnd()*55),h/2,rnd()*LEN-50)}
for(let i=0;i<60;i++){const side=rnd()<.5?-1:1,x=side*(22+rnd()*28),z=rnd()*LEN;if(z>PF0-10&&z<PF1+10&&x<0)continue;box(.4,2.4,.4,0x4a3426,x,1.2,z);box(3,4,3,0x35553a,x,4.2,z)}

const CREAM=0xd8d1c0,NAVY=0x2c3340,BLK=0x16171c;
cb(3.4,.5,.95,CREAM,0,-.87,-1.2);
cb(3.4,.04,.95,NAVY,0,-.6,-1.2);
cb(3.4,.035,.02,0xd8161c,0,-.575,-1.68);
cb(1.9,.3,.14,BLK,0,-.46,-1.6);
cb(.9,.34,.6,0x232a36,1.6,-.45,-1.25);
cb(.06,1.5,.06,CREAM,-1.3,.1,-1.3);cb(.06,1.5,.06,CREAM,1.3,.1,-1.3);
cb(3.4,.12,.2,0xcfc9ba,0,.84,-1.2);
cb(.5,.07,.02,0x2f6fb0,0,.55,-1.2);cb(.02,.25,.02,0x333333,-.18,.67,-1.2);cb(.02,.25,.02,0x333333,.18,.67,-1.2);

function drawSide(){
const T=s.t,rem=90-T,d=STOP-s.z,done=s.mode==='done',near=d<300&&d>-5;
let g=left.g;g.fillStyle='#f4f1e8';g.fillRect(0,0,400,272);g.fillStyle=NAVY&&'#2c3340';g.fillRect(0,0,400,40);
g.textBaseline='middle';g.textAlign='left';g.fillStyle='#fff';g.font='bold 22px sans-serif';g.fillText('時刻表',14,21);
g.fillStyle='#111';g.font='bold 20px sans-serif';g.fillText('駅',14,64);g.textAlign='right';g.fillText('着',270,64);g.fillText('発',384,64);

g.textAlign='left';g.fillStyle='#555';g.font='20px sans-serif';g.fillText('現在時刻',14,196);
g.fillStyle='#111';g.font='bold 34px sans-serif';g.fillText(clk(T),120,196);

// audio
let A=null;
function audio(){if(A)return;try{A=new(window.AudioContext||window.webkitAudioContext)();const b=A.createBuffer(1,A.sampleRate*2,A.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=A.createBufferSource();s.buffer=b;s.loop=true;A.f=A.createBiquadFilter();A.f.type='lowpass';A.f.frequency.value=250;A.g=A.createGain();A.g.gain.value=0;s.connect(A.f);A.f.connect(A.g);A.g.connect(A.destination);s.start()}catch(e){A=null}}
const beep=()=>{if(!A)return;const o=A.createOscillator(),g=A.createGain();o.frequency.value=880;g.gain.value=.05;o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+.12)};
// state
let s;
function reset(){s={z:0,v:0,n:0,pow:0,brk:0,t:0,ats:false,pen:0,moved:false,mode:'run',bt:0};$('ov').style.display='none';$('warn').style.display='none'}
s={z:0,v:0,n:0,pow:0,brk:0,t:0,ats:false,pen:0,moved:false,mode:'ready',bt:0};
const bar=$('bar');for(let k=0;k<14;k++){const i=document.createElement('i');i.className=k<8?'b':k===8?'n':'';bar.appendChild(i)}

addEventListener('keydown',e=>{if(e.repeat)return;audio();const k=e.key;
if(k==='ArrowUp'||k==='w'||k==='W'){hold(-1);e.preventDefault()}
else if(k==='ArrowDown'||k==='s'||k==='S'){hold(1);e.preventDefault()}
else if(k===' '){setN(-8);e.preventDefault()}
else if(k==='r'||k==='R')reset();
else if(k==='Enter'&&s.mode==='ready')reset()});
let ht=null,hi=null;
function stopHold(){clearTimeout(ht);clearInterval(hi);ht=hi=null}
function hold(d){stopHold();setN(s.n+d);ht=setTimeout(()=>{hi=setInterval(()=>setN(s.n+d),110)},350)}
addEventListener('keyup',e=>{if(['ArrowUp','ArrowDown','w','W','s','S'].includes(e.key))stopHold()});
addEventListener('blur',stopHold);
for(const[id,d]of[['bUp',1],['bDn',-1]]){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();audio();hold(d)});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,stopHold))}
$('start').onclick=()=>{audio();reset()};
function finish(over){
const err=s.z-STOP,a=Math.abs(err);let g,b;
if(over){g='D';b=0}else if(a<=.5){g='S';b=100}else if(a<=1){g='A';b=90}else if(a<=3){g='B';b=75}else if(a<=10){g='C';b=50}else{g='D';b=20}
const late=Math.max(0,Math.round(s.t-90)),sc=Math.max(0,b-s.pen-late);
const msg=over?'ホームの端を越えてオーバーランしました':a<.05?'ぴったり停止位置です':`停止位置から ${a.toFixed(2)} m ${err<0?'手前':'先'}で停止`;
s.mode='done';
$('ov').innerHTML=`<div class="box"><div class="big">${g}</div><h1>${over?'オーバーラン':'停車しました'}</h1><p>${msg}</p><p>所要 ${s.t.toFixed(1)} 秒${late?`(90秒超過 −${late})`:''}　ATS作動 ${s.pen/10} 回(−${s.pen})</p><p>スコア ${sc} 点</p><button class="go" id="again">もう一度走る</button></div>`;
$('ov').style.display='flex';$('again').onclick=reset;$('again').focus()}
function size(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();cab.position.z=-Math.max(0,Math.min(1,(1.5/cam.aspect-1)*.5))}
addEventListener('resize',size);size();
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
if(s.mode==='run'){
const kmh=s.v*3.6,lim=limitAt(s.z),over=kmh-lim;
if(!s.ats&&over>5){s.ats=true;s.pen+=10}
if(s.ats&&kmh<lim-3)s.ats=false;
const tp=(s.ats||s.n<=0)?0:s.n*.18;
const tb=s.ats?1.2:s.n===-8?1.35:s.n<0?-s.n*.14:0;
s.pow+=(tp-s.pow)*(1-Math.exp(-dt/.5));
s.brk+=(tb-s.brk)*(1-Math.exp(-dt/(tb<=s.brk?.4:(s.ats||s.n===-8)?.3:.9)));
let a=s.pow-s.brk-9.8*gradeAt(s.z)-(.012+.00012*s.v*s.v);
s.v+=a*dt;if(s.v<0)s.v=0;
s.z+=s.v*dt;s.t+=dt;if(s.v>3)s.moved=true;
if(over>1){s.bt-=dt;if(s.bt<=0){beep();s.bt=.6}}
if(s.z>PF1)finish(true);
else if(s.moved&&s.v<.03){s.v=0;finish(false)}
}
const d=STOP-s.z;
$('dist').textContent=Math.abs(d)<50?Math.abs(d).toFixed(1):Math.round(Math.abs(d));
$('dl').textContent=d>=0?'停止位置まで':'停止位置を過ぎた';
$('spd').textContent=Math.round(s.v*3.6);
$('lim').textContent=limitAt(s.z);
const gv=Math.round(gradeAt(s.z)*1000);$('gr').textContent=gv>0?'上り '+gv+'‰':gv<0?'下り '+(-gv)+'‰':'水平';
$('notch').textContent=s.ats?'ATS':s.n>0?'P'+s.n:s.n===0?'N':s.n===-8?'EB':'B'+(-s.n);
[...bar.children].forEach((c,k)=>c.classList.toggle('on',k===s.n+8));
const w=$('warn'),ov=s.v*3.6-limitAt(s.z);
w.style.display=s.mode==='run'&&(s.ats||ov>1)?'block':'none';w.textContent=s.ats?'ATS 非常ブレーキ作動中':'制限速度超過';
if(A){A.g.gain.value=Math.min(.35,s.v/30*.35);A.f.frequency.value=200+s.v*18}
const sw=s.v/25;
cam.position.set(Math.sin(s.z*.11)*.015*sw,2.7+Math.sin(s.z*.9)*.01*sw,s.z);
cam.lookAt(Math.sin(s.z*.05)*.2*sw,2.5,s.z+40);
drawMon();renderer.render(scene,cam)}
requestAnimationFrame(loop);
</script></body></html>
