<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>停車チャレンジ</title>
<style>
:root{--panel:rgba(18,16,24,.78);--amber:#ffb454;--ok:#7ee0a1;--bad:#ff6b6b;--text:#fff4e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#17141c;color:var(--text);overflow:hidden;font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#top{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.card{background:var(--panel);border-radius:10px;padding:8px 14px}
#dist{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
#dl{font-size:12px;opacity:.8;display:block}
#gr{font-weight:700;font-size:16px;white-space:nowrap}
#lim{width:64px;height:64px;border-radius:50%;background:#fff;border:7px solid #d62828;color:#111;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
#warn{position:fixed;left:50%;top:92px;transform:translateX(-50%);background:var(--bad);color:#2a0606;font-weight:700;padding:6px 16px;border-radius:8px;display:none}
#bot{position:fixed;left:0;right:0;bottom:0;padding:18px 14px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(transparent,rgba(10,8,14,.88) 40%);display:flex;flex-direction:column;align-items:center;gap:8px}
#row{display:flex;align-items:baseline;gap:18px}
#spd{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
#notch{font-size:28px;font-weight:700;color:var(--amber);min-width:56px}
#bar{display:flex;gap:3px}
#bar i{width:9px;height:10px;border-radius:2px;background:#4a4553}
#bar i.on{background:var(--amber)}#bar i.b.on{background:var(--bad)}#bar i.n.on{background:#fff}
#top,#row,#bar,#warn{display:none!important}
#bot{background:none!important;align-items:flex-start!important}
#pad{display:flex;gap:10px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 22px;background:#34303d;color:var(--text);cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--amber)}
#pad button{min-width:130px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}   /* スマホを横にした時に文字が勝手に大きくならないように */
#walkhud .tc{display:none}body.touch #walkhud .kb{display:none}body.touch #walkhud .tc{display:inline}
@media (hover:hover) and (pointer:fine){body:not(.touch) #pad{visibility:hidden}}   /* パソコンではタッチ用のボタンを隠す */
#vbtns{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:5;display:flex;flex-direction:column;gap:6px;align-items:flex-end}#vbtns button{padding:7px 12px;font-size:13px;background:var(--panel)}#vbtns button.on{background:var(--amber);color:#1a1205}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,12,20,.72);padding:16px}
#ov .box{background:var(--panel);border-radius:14px;padding:22px 26px;max-width:420px;line-height:1.7}
#ov h1{margin:0 0 8px;font-size:26px}#ov p{margin:4px 0}
#ov .big{font-size:56px;font-weight:800;line-height:1}
#ov .go{background:var(--amber);color:#2b1a00;margin-top:12px}
#ov.dw{background:none;align-items:flex-start;padding-top:64px;pointer-events:none}#ov.dw .box{pointer-events:auto}
button:disabled{opacity:.5;cursor:default}
kbd{background:#34303d;border-radius:4px;padding:1px 6px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translate(-50%,-12px);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;z-index:6;background:rgba(20,18,30,.9);color:#fff;border-radius:12px;padding:10px 16px;display:flex;gap:10px;align-items:center;font-size:15px;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{padding:6px 12px;font-size:14px}
#mbtn{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:5;padding:8px 14px;background:var(--panel);font-size:14px}
#menu{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(14,12,20,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px}
#menu .box{background:var(--panel);border-radius:14px;padding:22px 26px;width:min(420px,100%);line-height:1.7;box-sizing:border-box;max-height:100%;overflow:auto}
#menu h1{margin:0 0 6px;font-size:26px}#menu p{margin:6px 0}#menu .sub{opacity:.75;margin-bottom:10px}
.ml{display:flex;flex-direction:column;gap:10px;margin-top:14px}.ml button{width:100%;font-size:16px}
#menu .go{background:var(--amber);color:#2b1a00}
.set{display:flex;align-items:center;gap:10px;margin-top:10px}.set input{flex:1}
#menu .box.wide{width:min(1360px,100%)}
#menu h2{margin:14px 0 6px;font-size:14px;font-weight:700;opacity:.8;display:flex;justify-content:space-between;align-items:baseline}
#menu h2 .tv{font-size:22px;color:var(--amber);opacity:1;font-variant-numeric:tabular-nums}
.mg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.9fr);gap:18px;margin-top:6px}
@media(max-width:1100px){.mg{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.mgr{grid-column:1/-1}}
.mgr{background:rgba(255,255,255,.05);border-radius:12px;padding:12px 16px;align-self:start}
.mgr h2:first-child,.mgl h2:first-child{margin-top:0}
.tl{display:grid;gap:8px}.tl.c1{grid-template-columns:1fr}.tl.c2{grid-template-columns:1fr 1fr}.tl.c3{grid-template-columns:repeat(3,1fr)}.tl.c6{grid-template-columns:repeat(6,1fr)}.tl.c4{grid-template-columns:repeat(4,1fr)}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;background:#2a2633;border:2px solid transparent;border-radius:12px;padding:10px 12px;min-height:54px;text-align:left;line-height:1.3;font-size:16px}
.tile small{font-weight:400;opacity:.7;font-size:12px}
.tile.on{border-color:var(--amber);background:#3d3140;box-shadow:0 0 0 1px var(--amber)}
.tile:not(:disabled):hover,.tile:focus-visible{border-color:#e8e4f0;outline:none}.tile.on:hover{border-color:#ffd27a}   /* マウスを乗せた所に枠 */
.ldt{font:800 clamp(22px,4vw,40px) sans-serif;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.7)}.ldb{width:min(420px,70vw);height:6px;border-radius:3px;background:rgba(0,0,0,.45);overflow:hidden}.ldb>div{height:100%;width:0;background:#ffb000;transition:width .2s}.lds{font:600 14px sans-serif;color:#fff;text-shadow:0 1px 6px #000}
