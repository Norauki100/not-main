<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北川鉄道 時刻表検索</title>
<style>
  :root {
    --ink: #1c2430;
    --paper: #f6f4ee;
    --panel: #ffffff;
    --line: #dfd9c8;
    --brand: #2f5d50;
    --brand-dark: #1e3f36;
    --accent: #c1502e;
    --muted: #6b6458;
    --shadow: 0 2px 10px rgba(28,36,48,0.06);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 0 60px;
  }
  header.top {
    background: linear-gradient(135deg, var(--brand-dark), var(--brand));
    color: #fff;
    padding: 22px 20px 60px;
    position: relative;
    overflow: hidden;
  }
  header.top::after {
    content: "";
    position: absolute;
    right: -40px; top: -60px;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
  }
  header.top::before {
    content: "";
    position: absolute;
    right: 40px; bottom: -80px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
  }
  .brand-row {
    display: flex; align-items: baseline; gap: 10px;
    position: relative; z-index: 1;
  }
  .brand-mark {
    font-size: 13px;
    letter-spacing: 0.18em;
    color: rgba(255,255,255,0.75);
    font-weight: 600;
  }
  h1 {
    margin: 4px 0 2px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.02em;
    position: relative; z-index: 1;
  }
  .tagline {
    margin: 0;
    font-size: 12.5px;
    color: rgba(255,255,255,0.7);
    position: relative; z-index: 1;
  }

  .tabs {
    position: relative;
    z-index: 2;
    margin: 18px 20px -42px;
    display: flex;
    background: #e6e0cf;
    border-radius: 14px;
    padding: 4px;
    box-shadow: 0 2px 10px rgba(28,36,48,0.08);
  }
  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: #3d5a50;
    padding: 11px 6px;
    font-size: 13.5px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    font-family: inherit;
  }
  .tab-btn.active {
    background: #fff;
    color: var(--brand-dark);
  }

  main {
    padding: 60px 20px 0;
  }
  .panel {
    background: var(--panel);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 18px;
    margin-bottom: 16px;
  }
  .field-label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.06em;
    margin-bottom: 6px;
    display: block;
  }
  .station-input-wrap { position: relative; }
  input[type="text"] {
    width: 100%;
    font-size: 16px;
    padding: 13px 14px;
    border-radius: 11px;
    border: 1.5px solid var(--line);
    background: #fbfaf6;
    font-family: inherit;
    color: var(--ink);
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--brand);
    background: #fff;
  }
  .suggest-list {
    position: absolute;
    left: 0; right: 0; top: calc(100% + 4px);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    max-height: 260px;
    overflow-y: auto;
    z-index: 10;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    display: none;
  }
  .suggest-list.show { display: block; }
  .suggest-item {
    padding: 10px 14px;
    cursor: pointer;
    font-size: 14.5px;
    border-bottom: 1px solid #f0eee6;
  }
  .suggest-item:last-child { border-bottom: none; }
  .suggest-item:hover, .suggest-item.hi {
    background: #f1ede1;
  }
  .suggest-item .sub {
    color: var(--muted);
    font-size: 12px;
    margin-top: 1px;
  }

  .swap-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
  }
  .swap-btn {
    border: 1.5px solid var(--line);
    background: #fbfaf6;
    color: var(--brand-dark);
    width: 38px; height: 38px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .swap-btn:active { transform: scale(0.94); }

  .row-gap { height: 12px; }

  .go-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 15.5px;
    font-weight: 800;
    letter-spacing: 0.02em;
    cursor: pointer;
    margin-top: 4px;
  }
  .go-btn:active { transform: translateY(1px); }

  .time-select-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  select {
    font-family: inherit;
    font-size: 14px;
    padding: 10px 8px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: #fbfaf6;
    color: var(--ink);
  }
  .now-btn {
    font-size: 12.5px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--brand-dark);
    cursor: pointer;
    font-weight: 700;
  }

  .section-title {
    font-size: 13px;
    font-weight: 800;
    color: var(--brand-dark);
    margin: 22px 2px 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .cnt {
    font-weight: 500;
    color: var(--muted);
    font-size: 12px;
  }

  .result-card {
    background: var(--panel);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .result-times {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 56px;
  }
  .result-times .t1 { font-size: 19px; font-weight: 800; line-height: 1.1; }
  .result-times .t2 { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .result-arrow { color: var(--muted); font-size: 13px; }
  .result-mid { flex: 1; min-width: 0; }
  .line-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 800;
    color: #fff;
    padding: 3px 9px;
    border-radius: 999px;
    margin-bottom: 5px;
  }
  .company-badge {
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    font-weight: 700;
    color: var(--brand-dark);
    background: #eae5d4;
    border: 1px solid var(--line);
    padding: 2px 7px;
    border-radius: 999px;
    margin-bottom: 5px;
    margin-right: 4px;
  }
  .result-mid .via {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .result-dur {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .result-dur b { color: var(--ink); font-size: 15px; display: block; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 13.5px;
  }

  /* Station timetable view */
  .tt-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .tt-station-name {
    font-size: 19px;
    font-weight: 800;
  }
  .tt-line-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 10px 0 4px;
    margin-bottom: 4px;
  }
  .tt-line-tab {
    flex-shrink: 0;
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    opacity: 0.45;
    white-space: nowrap;
  }
  .tt-line-tab.active { opacity: 1; }
  .dir-toggle {
    display: flex;
    background: #f1ede1;
    border-radius: 10px;
    padding: 3px;
    margin: 10px 0 4px;
  }
  .dir-btn {
    flex: 1;
    text-align: center;
    padding: 8px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
  }
  .dir-btn.active { background: #fff; color: var(--brand-dark); box-shadow: var(--shadow); }

  .hour-block {
    display: flex;
    border-bottom: 1px solid #efece2;
    padding: 9px 2px;
  }
  .hour-block:last-child { border-bottom: none; }
  .hour-label {
    width: 40px;
    flex-shrink: 0;
    font-weight: 800;
    font-size: 15px;
    color: var(--brand-dark);
    padding-top: 1px;
  }
  .hour-mins {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
  }
  .min-entry {
    font-size: 14.5px;
    color: var(--ink);
    cursor: pointer;
    position: relative;
  }
  .min-entry .tag {
    font-size: 9px;
    vertical-align: top;
    color: var(--accent);
    font-weight: 800;
    margin-left: 1px;
  }

  .stop-panel-toggle {
    text-align: center;
    font-size: 12px;
    color: var(--brand-dark);
    font-weight: 700;
    padding: 10px;
    cursor: pointer;
  }

  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(20,24,20,0.4);
    display: none;
    align-items: flex-end;
    z-index: 100;
  }
  .modal-backdrop.show { display: flex; }
  .modal-sheet {
    background: #fff;
    width: 100%;
    max-height: 78vh;
    border-radius: 18px 18px 0 0;
    padding: 16px 18px 24px;
    overflow-y: auto;
    margin: 0 auto;
    max-width: 720px;
  }
  .modal-title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .modal-close {
    border: none;
    background: #f1ede1;
    width: 30px; height: 30px;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
    color: var(--muted);
  }
  .stop-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7px 0;
    font-size: 14px;
  }
  .stop-row .st-time {
    width: 52px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .stop-row .st-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--line);
    flex-shrink: 0;
  }
  .stop-row.origin .st-dot, .stop-row.dest .st-dot {
    background: var(--accent);
    width: 10px; height: 10px;
  }
  .stop-row .st-name { flex: 1; }
  .stop-row.origin .st-name, .stop-row.dest .st-name { font-weight: 800; }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 24px 20px 0;
    line-height: 1.7;
  }

  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: #d8d2c2; border-radius: 4px; }

  /* 駅の時刻表: 分ごとのセル */
  .min-entry { display: inline-flex; flex-direction: column; align-items: center; min-width: 46px; padding: 3px 6px 4px; border-radius: 8px; background: #faf8f1; border: 1px solid #eee9da; line-height: 1.25; }
  .min-entry:active { background: #f1ede1; }
  .min-entry .mm { font-weight: 800; font-size: 15px; }
  .min-entry .mt { font-size: 9.5px; font-weight: 800; color: var(--accent); min-height: 11px; }
  .min-entry .md { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .dir-toggle { flex-wrap: wrap; gap: 3px; }
  .dir-btn { flex: 1 1 auto; padding: 8px 10px; }

  /* 運転日の注記 */
  .min-entry .mw { font-size: 9px; font-weight: 800; color: #fff; background: var(--accent); border-radius: 4px; padding: 0 4px; margin-top: 2px; }
  .days-note { font-size: 11px; font-weight: 800; color: #fff; background: var(--accent); border-radius: 4px; padding: 1px 6px; margin-left: 4px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand-row">
      <span class="brand-mark">KITAGAWA RAILWAY</span>
    </div>
    <h1>北川鉄道 時刻表検索</h1>
    <p class="tagline">エクスポートされたダイヤデータから、駅の時刻表と2駅間の直通列車を検索します</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="route">駅から駅</button>
    <button class="tab-btn" data-tab="station">駅の時刻表</button>
  </div>

  <main>
    <!-- ROUTE SEARCH TAB -->
    <div id="tab-route" class="tab-content">
      <div class="panel">
        <span class="field-label">出発駅</span>
        <div class="station-input-wrap">
          <input type="text" id="from-input" placeholder="駅名を入力（例：名古屋）" autocomplete="off">
          <div class="suggest-list" id="from-suggest"></div>
        </div>

        <div class="swap-row">
          <div style="flex:1;height:1px;"></div>
          <button class="swap-btn" id="swap-btn" title="入れ替え">⇅</button>
          <div style="flex:1;height:1px;"></div>
        </div>

        <span class="field-label">到着駅</span>
        <div class="station-input-wrap">
          <input type="text" id="to-input" placeholder="駅名を入力（例：岐阜）" autocomplete="off">
          <div class="suggest-list" id="to-suggest"></div>
        </div>

        <div class="time-select-row">
          <select id="hour-select"></select>
          <select id="min-select"></select>
          <button class="now-btn" id="now-btn">現在時刻</button>
        </div>

        <button class="go-btn" id="search-btn">この条件で検索</button>
      </div>

      <div id="route-results"></div>
    </div>

    <!-- STATION TIMETABLE TAB -->
    <div id="tab-station" class="tab-content" style="display:none;">
      <div class="panel">
        <span class="field-label">駅を選択</span>
        <div class="station-input-wrap">
          <input type="text" id="station-input" placeholder="駅名を入力（例：金山）" autocomplete="off">
          <div class="suggest-list" id="station-suggest"></div>
        </div>
      </div>
      <div id="station-results"></div>
    </div>

    <p class="footer-note">Nimby Rails のタイムテーブルエクスポートJSONを解析して生成しています。<br>時刻はゲーム内ダイヤの発着時刻（24時間表記）です。</p>
  </main>
</div>

<div class="modal-backdrop" id="stop-modal">
  <div class="modal-sheet">
    <div class="modal-title-row">
      <div>
        <div style="font-size:12px;color:var(--muted);font-weight:700;" id="modal-line-name"></div>
        <div style="font-size:16px;font-weight:800;" id="modal-train-name"></div>
      </div>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div id="modal-stops"></div>
  </div>

<script>
(function () {
  "use strict";

  // ---------- Load data ----------
  const RAW = JSON.parse(document.getElementById("ttdata").textContent);
  const STATIONS = RAW.st;        // array of station name strings
  const LINES = RAW.ln;           // array of {n, c, col, s:[station idx...]}
  const RUNS = RAW.rn;
  const LL = RAW.ll || [];   // 駅の座標 [経度, 緯度]            // array of [line_idx, enter_stop_idx, train_name, [arr,dep,...]]

  // Stations that get a 3-minute transfer allowance; everything else gets 2.
  function normalizeName(name) {
    // strip a leading line-code token like "KH24 " and decorative marks
    // "N04 S02 ☆栄☆" のように路線ナンバーが複数並ぶ駅があるので、先頭のコードを全部外す
    let n = name;
    while (/^[A-Za-z]+\d+\s+/.test(n)) n = n.replace(/^[A-Za-z]+\d+\s+/, "");
    n = n.replace(/^[☆★#!]+|[☆★#!]+$/g, "").trim();
    return n;
  }
  const BIG_TRANSFER_NAMES = new Set(["名古屋", "金山", "豊橋", "岡崎"]);
  const BIG_TRANSFER_IDX = new Set();
  STATIONS.forEach((name, i) => {
    if (BIG_TRANSFER_NAMES.has(normalizeName(name))) BIG_TRANSFER_IDX.add(i);
  });
  function transferMinutes(stationIdx) {
    return BIG_TRANSFER_IDX.has(stationIdx) ? 3 : 2;
  }

  // ---------- Build station -> line -> sorted departure events index ----------
  // stationLineEvents[stationIdx][lineIdx] = sorted array of [depMinute, runId, posInRun]
  const stationLineEvents = new Map();

  RUNS.forEach((run, rid) => {
    const [lineIdx, enter, trainName, times] = run;
    const stops = LINES[lineIdx].s;
    const n = times.length / 2;
    for (let pos = 0; pos < n; pos++) {
      const li = enter + pos;
      if (li >= stops.length) break;
      const sidx = stops[li];
      if (sidx === -1) continue;
      const dep = times[pos * 2 + 1];
      if (dep === null || dep === undefined) continue;
      if (!stationLineEvents.has(sidx)) stationLineEvents.set(sidx, new Map());
      const byLine = stationLineEvents.get(sidx);
      if (!byLine.has(lineIdx)) byLine.set(lineIdx, []);
      byLine.get(lineIdx).push([dep, rid, pos]);
    }
  });
  for (const byLine of stationLineEvents.values()) {
    for (const arr of byLine.values()) {
      arr.sort((a, b) => a[0] - b[0]);
    }
  }

  // ---------- Also build station -> full sorted event list (for station timetable tab, later) ----------
  // (left for a future pass; not required for route search)

  // ---------- Binary search helper ----------
  function bisectLeft(arr, target) {
    // arr of [depMinute, ...], find first index with arr[i][0] >= target
    let lo = 0, hi = arr.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (arr[mid][0] < target) lo = mid + 1;
      else hi = mid;
    }
    return lo;
  }

  // ---------- Time-dependent Dijkstra ----------
  // Returns { best: Map(stationIdx -> arrivalAbsMinutes), came: Map(stationIdx -> [runId, boardPos, boardAbs, alightPos, arrAbs, fromStation]) }
  function findRoute(fromIdx, toIdx, startMinutes, maxWallMs) {
    const best = new Map();
    const came = new Map();
    best.set(fromIdx, startMinutes);

    // simple binary heap (min-heap) using arrays: [time, station]
    const heap = [];
    function push(item) {
      heap.push(item);
      let i = heap.length - 1;
      while (i > 0) {
        const p = (i - 1) >> 1;
        if (heap[p][0] <= heap[i][0]) break;
        [heap[p], heap[i]] = [heap[i], heap[p]];
        i = p;
      }
    }
    function pop() {
      const top = heap[0];
      const last = heap.pop();
      if (heap.length) {
        heap[0] = last;
        let i = 0;
        while (true) {
          let l = i * 2 + 1, r = i * 2 + 2, smallest = i;
          if (l < heap.length && heap[l][0] < heap[smallest][0]) smallest = l;
          if (r < heap.length && heap[r][0] < heap[smallest][0]) smallest = r;
          if (smallest === i) break;
          [heap[smallest], heap[i]] = [heap[i], heap[smallest]];
          i = smallest;
        }
      }
      return top;
    }

    push([startMinutes, fromIdx]);
    const finalized = new Set();
    const t0 = Date.now();
    const deadline = maxWallMs || 1500;

    while (heap.length) {
      if (Date.now() - t0 > deadline) break; // safety valve
      const [t, u] = pop();
      if (finalized.has(u)) continue;
      finalized.add(u);
      if (u === toIdx) break;

      const boardAfter = (u === fromIdx) ? t : t + transferMinutes(u);
      const byLine = stationLineEvents.get(u);
      if (!byLine) continue;

      for (const [lineIdx, events] of byLine.entries()) {
        const dayOffset0 = Math.floor(boardAfter / 1440) * 1440;
        const modT = boardAfter - dayOffset0;
        let idx = bisectLeft(events, modT);
        let dayOffset = dayOffset0;
        if (idx >= events.length) {
          idx = 0;
          dayOffset += 1440;
        }
        const [dep, rid, pos] = events[idx];
        const actualDep = dep + dayOffset;

        const run = RUNS[rid];
        const enter = run[1];
        const times = run[3];
        const stops = LINES[lineIdx].s;
        const n = times.length / 2;

        for (let pos2 = pos + 1; pos2 < n; pos2++) {
          const li = enter + pos2;
          if (li >= stops.length) break;
          const sidx2 = stops[li];
          const arrv = times[pos2 * 2];
          if (sidx2 === -1 || arrv === null || arrv === undefined) continue;

          let baseDay = dayOffset;
          if (arrv < dep) baseDay += 1440;
          let arrAbs = arrv + baseDay;
          if (arrAbs < actualDep) arrAbs += 1440;

          if (!best.has(sidx2) || arrAbs < best.get(sidx2) - 1e-9) {
            best.set(sidx2, arrAbs);
            came.set(sidx2, [rid, pos, actualDep, pos2, arrAbs, u]);
            push([arrAbs, sidx2]);
          }
        }
      }
    }
    return { best, came };
  }

  function reconstructPath(came, toIdx) {
    const path = [];
    let cur = toIdx;
    while (came.has(cur)) {
      const [rid, boardPos, boardAbs, alightPos, arrAbs, fromSt] = came.get(cur);
      path.push({ from: fromSt, to: cur, rid, boardAbs, arrAbs, boardPos, alightPos });
      cur = fromSt;
    }
    path.reverse();
    return path;
  }

  // Merge consecutive legs that are on the same run (shouldn't normally happen since
  // we only alight where beneficial, but guard anyway) -- not needed given algorithm design.

  // Find several distinct route options: fastest, then a couple of alternates by
  // excluding the first leg's line and re-running, and by trying slightly later start times.
  function findRouteOptions(fromIdx, toIdx, startMinutes) {
    const options = [];
    const seen = new Set();

    function keyForPath(path) {
      return path.map(l => l.rid + ":" + l.boardPos + ":" + l.alightPos).join("|");
    }

    // Option 1: fastest from requested time
    let { best, came } = findRoute(fromIdx, toIdx, startMinutes);
    if (best.has(toIdx)) {
      const path = reconstructPath(came, toIdx);
      const k = keyForPath(path);
      if (!seen.has(k)) {
        seen.add(k);
        options.push({ arrival: best.get(toIdx), path });
      }
    }

    // Options 2-4: search again starting just after each option's first-leg departure,
    // to surface the "next few departures" rather than alternate paths with worse times.
    let cursor = startMinutes;
    for (let i = 0; i < 4 && options.length < 5; i++) {
      if (options.length === 0) break;
      const lastPath = options[options.length - 1].path;
      if (!lastPath.length) break;
      cursor = lastPath[0].boardAbs + 1;
      const r = findRoute(fromIdx, toIdx, cursor);
      if (!r.best.has(toIdx)) break;
      const path = reconstructPath(r.came, toIdx);
      const k = keyForPath(path);
      if (!seen.has(k)) {
        seen.add(k);
        options.push({ arrival: r.best.get(toIdx), path });
      }
    }
    return options;
  }

  // ---------- Time formatting ----------
  function fmtHM(absMinutes) {
    const days = Math.floor(absMinutes / 1440);
    const m = ((absMinutes % 1440) + 1440) % 1440;
    const h = Math.floor(m / 60);
    const mm = m % 60;
    const s = `${String(h).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
    return days > 0 ? `${s} (翌${days > 1 ? days : ""}日)` : s;
  }
  function fmtDuration(mins) {
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    if (h > 0) return `${h}時間${m}分`;
    return `${m}分`;
  }

  // ---------- Station name display helpers ----------
  function displayName(idx) {
    return normalizeName(STATIONS[idx]);
  }
  function fullLabel(idx) {
    return STATIONS[idx];
  }

  // ---------- Autocomplete ----------
  function setupAutocomplete(inputEl, listEl, onPick) {
    let hiIndex = -1;
    let currentMatches = [];

    function render(matches) {
      currentMatches = matches;
      hiIndex = -1;
      if (!matches.length) {
        listEl.classList.remove("show");
        listEl.innerHTML = "";
        return;
      }
      listEl.innerHTML = matches
        .map((m, i) => `<div class="suggest-item" data-idx="${m.idx}">${escapeHtml(m.name)}</div>`)
        .join("");
      listEl.classList.add("show");
    }

    function search(q) {
      if (!q.trim()) { render([]); return; }
      const ql = q.trim();
      const results = [];
      for (let i = 0; i < STATIONS.length; i++) {
        const name = STATIONS[i];
        const norm = displayName(i);
        if (name.includes(ql) || norm.includes(ql)) {
          results.push({ idx: i, name });
          if (results.length >= 30) break;
        }
      }
      render(results);
    }

    inputEl.addEventListener("input", () => search(inputEl.value));
    inputEl.addEventListener("focus", () => { if (inputEl.value.trim()) search(inputEl.value); });
    inputEl.addEventListener("blur", () => {
      setTimeout(() => listEl.classList.remove("show"), 150);
    });
    inputEl.addEventListener("keydown", (e) => {
      if (!listEl.classList.contains("show")) return;
      const items = Array.from(listEl.querySelectorAll(".suggest-item"));
      if (e.key === "ArrowDown") {
        e.preventDefault();
        hiIndex = Math.min(hiIndex + 1, items.length - 1);
        items.forEach((it, i) => it.classList.toggle("hi", i === hiIndex));
        if (items[hiIndex]) items[hiIndex].scrollIntoView({ block: "nearest" });
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        hiIndex = Math.max(hiIndex - 1, 0);
        items.forEach((it, i) => it.classList.toggle("hi", i === hiIndex));
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (hiIndex >= 0 && currentMatches[hiIndex]) {
          pick(currentMatches[hiIndex]);
        } else if (currentMatches.length) {
          pick(currentMatches[0]);
        }
      }
    });
    listEl.addEventListener("mousedown", (e) => {
      const item = e.target.closest(".suggest-item");
      if (!item) return;
      const idx = parseInt(item.dataset.idx, 10);
      const match = currentMatches.find(m => m.idx === idx);
      if (match) pick(match);
    });

    function pick(match) {
      inputEl.value = displayName(match.idx);
      inputEl.dataset.stationIdx = match.idx;
      listEl.classList.remove("show");
      onPick(match.idx);
    }
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---------- Time selectors ----------
  const hourSelect = document.getElementById("hour-select");
  const minSelect = document.getElementById("min-select");
  for (let h = 0; h < 24; h++) {
    const opt = document.createElement("option");
    opt.value = h; opt.textContent = `${String(h).padStart(2, "0")}時`;
    hourSelect.appendChild(opt);
  }
  for (let m = 0; m < 60; m += 1) {
    const opt = document.createElement("option");
    opt.value = m; opt.textContent = `${String(m).padStart(2, "0")}分`;
    minSelect.appendChild(opt);
  }
  function setNow() {
    const now = new Date();
    hourSelect.value = now.getHours();
    minSelect.value = now.getMinutes();
  }
  setNow();
  document.getElementById("now-btn").addEventListener("click", setNow);

  // ---------- Tabs ----------
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.querySelectorAll(".tab-content").forEach(c => c.style.display = "none");
      document.getElementById("tab-" + btn.dataset.tab).style.display = "";
    });

  // ---------- Route search wiring ----------
  const fromInput = document.getElementById("from-input");
  const toInput = document.getElementById("to-input");
  const fromSuggest = document.getElementById("from-suggest");
  const toSuggest = document.getElementById("to-suggest");
  const resultsEl = document.getElementById("route-results");

  let fromIdx = null, toIdx = null;

  setupAutocomplete(fromInput, fromSuggest, (idx) => { fromIdx = idx; });
  setupAutocomplete(toInput, toSuggest, (idx) => { toIdx = idx; });

  document.getElementById("swap-btn").addEventListener("click", () => {
    const tmpVal = fromInput.value; fromInput.value = toInput.value; toInput.value = tmpVal;
    const tmpIdx = fromIdx; fromIdx = toIdx; toIdx = tmpIdx;
  });

  document.getElementById("search-btn").addEventListener("click", () => {
    if (fromIdx === null || toIdx === null) {
      resultsEl.innerHTML = `<div class="empty-state">出発駅と到着駅を選択してください</div>`;
      return;
    }
    if (fromIdx === toIdx) {
      resultsEl.innerHTML = `<div class="empty-state">出発駅と到着駅が同じです</div>`;
      return;
    }
    const h = parseInt(hourSelect.value, 10) || 0;
    const m = parseInt(minSelect.value, 10) || 0;

    resultsEl.innerHTML = `<div class="empty-state">検索中…</div>`;
    setTimeout(() => {
      const options = findRouteOptions(fromIdx, toIdx, startMinutes);

    }, 10);

  function lineDisplayName(line) {
    // Strip a redundant leading company prefix from the line name when we
    // already show it as a separate badge (e.g. "名城鉄道 東名古屋線" -> "東名古屋線").
    let name = line.n;
    if (line.co && name.startsWith(line.co)) {
      name = name.slice(line.co.length).trim();
    } else if (line.co === "城北小牧鉄道" && name.startsWith("城鉄")) {
      name = name.slice(2).trim();
    }
    if (line.co === "名城鉄道") name = name.replace(/^本線(?=\s|$)/, "名城本線");     // 名城快速は名城本線と同じ路線
    if (name.startsWith("北川本線")) name = name.replace(/\s*[（(][^）)]*[）)]/g, "").trim(); // (米原)(浜松)は出さない
    return name;
  }

  // ---------- Train name / car-count parsing ----------
  // Run's stored field is "trainName|trainCode" (see data build step).
  function splitTrainField(raw) {
    if (!raw) return { name: "", code: "" };
    const i = raw.indexOf("|");
    if (i === -1) return { name: raw.trim(), code: "" };
    return { name: raw.slice(0, i).trim(), code: raw.slice(i + 1).trim() };
  }

  // Extract car count from a code/name like "315-8C-5", "6A-8C-C7", "N30-7C-1",
  // "N3000-6-1", "313+315-8C". Cross-seat cars (this operator's fleet) are marked
  // with a "C" suffix on the car-count segment; that's a fleet trait here, not
  // a per-train variable, so we don't surface a separate flag for it.
  function parseCarCount(name, code) {
    let m = code.match(/-(\d+)C-C?\d+$/);
    if (m) return parseInt(m[1], 10);
    m = code.match(/-(\d+)-\d+$/);
    if (m) return parseInt(m[1], 10);
    m = code.match(/-(\d+)C$/);
    if (m) return parseInt(m[1], 10);
    // Fallback: some codes omit the car count that only appears in the name
    // (e.g. code "N10-1801F" but name "N10-9C-1801F").
    m = name.match(/-(\d+)C-/);
    if (m) return parseInt(m[1], 10);
    return null;
  }

  function trainLabel(rawField) {
    const { name, code } = splitTrainField(rawField);
    const cars = parseCarCount(name, code);
    return { name, cars };
  }


  function lineChip(lineIdx) {
    const line = LINES[lineIdx];
    const companyBadge = line.co
      ? `<span class="company-badge">${escapeHtml(line.co)}</span>`
      : "";
    return `${companyBadge}<span class="line-chip" style="background:${line.col}">${escapeHtml(lineDisplayName(line))}</span>`;
  }

  function renderRouteResults(options, startMinutes) {
    if (!options.length) {
      resultsEl.innerHTML = `<div class="empty-state">この時刻以降、直通・乗換とも経路が見つかりませんでした。</div>`;
      return;
    }
    const title = `<div class="section-title">検索結果 <span class="cnt">${options.length}件</span></div>`;
    const cards = options.map((opt, i) => {
      const depTime = opt.path[0].boardAbs;
      const totalMin = opt.arrival - depTime;
      const transferCount = opt.path.length - 1;
      const lineChips = opt.path.map(leg => lineChip(RUNS[leg.rid][0])).join("");
      let viaText;
      if (transferCount > 0) {
        viaText = opt.path.slice(0, -1).map(leg => displayName(leg.to)).join(" ・ ") + " 乗換";
      } else {
        const { cars } = trainLabel(RUNS[opt.path[0].rid][2]);
        viaText = "直通" + (cars ? `・${cars}両編成` : "");
      }
      const dayNotes = [...new Set(opt.path.map(l => runDaysNote(RUNS[l.rid][4])).filter(Boolean))];
      if (dayNotes.length) viaText += "・" + dayNotes.join("・");
      return `
        <div class="result-card" data-opt="${i}">
          <div class="result-times">
            <div class="t1">${fmtHM(depTime)}</div>
            <div class="result-arrow">↓</div>
            <div class="t1">${fmtHM(opt.arrival)}</div>
          </div>
          <div class="result-mid">
            ${lineChips}
            <div class="via">${escapeHtml(viaText)}${transferCount > 0 ? ` (${transferCount}回)` : ""}</div>
          </div>
          <div class="result-dur">
            <b>${fmtDuration(totalMin)}</b>
            所要
          </div>
        </div>
      `;
    }).join("");
    resultsEl.innerHTML = title + cards;

    resultsEl.querySelectorAll(".result-card").forEach(card => {
      card.addEventListener("click", () => {
        const i = parseInt(card.dataset.opt, 10);
        openRouteDetail(options[i]);
      });
    });
  }

  // ---------- Route detail modal ----------
  const modal = document.getElementById("stop-modal");
  const modalStops = document.getElementById("modal-stops");
  const modalLineName = document.getElementById("modal-line-name");
  const modalTrainName = document.getElementById("modal-train-name");
  document.getElementById("modal-close").addEventListener("click", () => modal.classList.remove("show"));
  modal.addEventListener("mousedown", (e) => { if (e.target === modal) modal.classList.remove("show"); });

  function openRouteDetail(opt) {
    modalLineName.textContent = "経路の詳細";
    modalTrainName.textContent = `${displayName(opt.path[0].from)} → ${displayName(opt.path[opt.path.length - 1].to)}`;

    let html = "";
    opt.path.forEach((leg, i) => {
      const run = RUNS[leg.rid];
      const lineIdx = run[0];
      const { name: trainName, cars } = trainLabel(run[2]);
      const carsText = cars ? `${cars}両編成` : "";
      const legDays = runDaysNote(run[4]);
      html += `<div style="margin:14px 0 6px;">
        ${lineChip(lineIdx)} <span style="font-size:12.5px;color:var(--muted);">${escapeHtml(trainName || "")}${carsText ? " ・ " + carsText : ""}</span>${legDays ? ` <span class="days-note">${legDays}</span>` : ""}
      </div>`;
      html += `<div class="stop-row origin">
        <div class="st-time">${fmtHM(leg.boardAbs)}</div>
        <div class="st-dot"></div>
        <div class="st-name">${escapeHtml(displayName(leg.from))} 発</div>
      </div>`;
      html += `<div class="stop-row dest">
        <div class="st-time">${fmtHM(leg.arrAbs)}</div>
        <div class="st-dot"></div>
        <div class="st-name">${escapeHtml(displayName(leg.to))} 着</div>
      </div>`;
      if (i < opt.path.length - 1) {
        const nextLeg = opt.path[i + 1];
        const waitMin = nextLeg.boardAbs - leg.arrAbs;
        html += `<div style="padding:8px 0 8px 20px;color:var(--muted);font-size:12.5px;">
          乗換 ${waitMin}分待ち → ${lineChip(RUNS[nextLeg.rid][0])}
        </div>`;
      }
    });
    modalStops.innerHTML = html;
    modal.classList.add("show");
  }


  // ================= 駅の時刻表 =================
  // 路線の stops は「行き(0..center)＋帰り(center..)」を1本につないだ配列。
  // center は左右対称になる位置(折り返し駅)で、これより前が行き、以降が帰り。
  const LINE_CENTER = LINES.map(line => {
    const s = line.s, n = s.length;
    if (n < 4) return Math.floor(n / 2);
    // 折り返し駅の前後は同じ駅が鏡のように並ぶ。折り返し駅に近い一致ほど重く数える
    // (通過の位置は照合しない。遠くの偶然の一致に引っぱられないようにするため)
    let best = -1, bestK = Math.floor(n / 2);
    for (let k = 1; k < n - 1; k++) {
      if (s[k] === -1) continue;
      let sc = 0;
      const span = Math.min(k, n - 1 - k);
      for (let j = 1; j <= span; j++) {
        const a = s[k - j], b = s[k + j];
        if (a !== -1 && a === b) sc += 1 / j;
      }
      if (sc > best + 1e-9 || (Math.abs(sc - best) <= 1e-9 && Math.abs(k - n / 2) < Math.abs(bestK - n / 2))) {
        best = sc; bestK = k;
      }
    }
    return bestK;
  });

  function localTurns(s) {
    const out = [];
    for (let k = 1; k < s.length - 1; k++) {
      if (s[k] === -1) continue;
      let p = k - 1; while (p >= 0 && s[p] === -1) p--;
      let q = k + 1; while (q < s.length && s[q] === -1) q++;
      if (p >= 0 && q < s.length && s[p] === s[q]) out.push(k);
    }
    return out;
  }
  // 見つからない路線は、これまでの全体の対称位置を折り返しとする
  const LINE_TURNS = LINES.map((line, i) => { const t = localTurns(line.s); return t.length ? t : [LINE_CENTER[i]]; });
  // 始発駅が途中や最後にもう一度出てくる位置。そこで一度「始発駅に戻って終点」になり、
  // 次の運行が始まる(例: 枇杷島線 須ケ口→青塚→須ケ口 の次に 須ケ口→上小田井→須ケ口)
  const LINE_HUBS = LINES.map(line => {
    const s = line.s;
    const f = s.findIndex(x => x !== -1);
    const out = [];
    if (f >= 0) for (let m = f + 1; m < s.length; m++) if (s[m] === s[f]) out.push(m);
    return out;
  });
  // 位置 li から先で最初に来る終点(折り返し駅、または始発駅への戻り)。なければ null = 路線の最後まで走って始発駅へ戻る
  function nextTurnIdx(lineIdx, li) {
    let best = null;
    for (const t of LINE_TURNS[lineIdx]) if (t > li) { best = t; break; }
    for (const m of LINE_HUBS[lineIdx]) if (m > li) { if (best === null || m < best) best = m; break; }
    return best;
  }
  function nearestRealStop(stops, from, step) {
    for (let i = from; i >= 0 && i < stops.length; i += step) {
      if (stops[i] !== -1) return stops[i];
    }
    return null;
  }
  // 方面ラベル: 行きは折り返し駅の側、帰りは始発駅の側
  const LINE_DIR_LABEL = LINES.map((line, i) => {
    const outSt = nearestRealStop(line.s, LINE_CENTER[i], -1);
    const inSt = nearestRealStop(line.s, 0, 1);
    return {
      out: outSt === null ? "" : displayName(outSt) + "方面",
      inn: inSt === null ? "" : displayName(inSt) + "方面",
    };
  });

  // 方面ラベル: 次の折り返し駅(なければ始発駅)
  function dirLabel(stops, segEnd) {
    const st = segEnd !== null ? nearestRealStop(stops, segEnd, -1) : nearestRealStop(stops, 0, 1);
    return st === null ? "" : displayName(st) + "方面";
  }

  function lineFamily(line) {
    let n = line.n;
    if (line.co && n.startsWith(line.co)) n = n.slice(line.co.length).trim();
    const parts = n.split(/\s+/);
    let base = parts[0];
    let kind = parts.slice(1).join(" ");
    // 名城快速は名城本線と同じ路線
    if (line.co === "名城鉄道" && base === "本線") base = "名城本線";
    // 北川本線の (米原)(浜松) などは系統を分けているだけなので出さない
    if (base === "北川本線") kind = kind.replace(/[（(][^）)]*[）)]/g, "").replace(/\s+/g, " ").trim();
    return {
      key: (line.co || "") + "|" + base,
      label: (line.co ? line.co + " " : "") + base,
      kind,
    };
  }

  function textOn(hex) {
    const h = hex.replace("#", "");
    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.68 ? "#1c2430" : "#fff";
  }
  // 運転日(7日周期の営業日ビット)。下位5ビット=平日、上位2ビット=土休日
  function runDaysNote(mask) {
    if (!mask || mask === 127) return "";
    if (mask === 95) return "土曜運休";   // 土曜(ビット5)だけ運行なし
    if (mask === 63) return "日曜運休";   // 日曜(ビット6)だけ運行なし
    if ((mask & 96) === 0) return "平日のみ";
    if ((mask & 31) === 0) return "土休日のみ";
    return "";
  }
  const pad2 = (n) => String(n).padStart(2, "0");
  const hhmm = (m) => `${pad2(Math.floor(m / 60) % 24)}:${pad2(m % 60)}`;

  // 駅 sidx から発車する列車を 路線グループ → 方面 にまとめる
  function buildStationTimetable(sidx) {
    const byLine = stationLineEvents.get(sidx);
    if (!byLine) return [];
    const fams = new Map();
    for (const [lineIdx, events] of byLine.entries()) {
      const line = LINES[lineIdx];
      const stops = line.s;
      const center = LINE_CENTER[lineIdx];
      const fam = lineFamily(line);
      if (!fams.has(fam.key)) fams.set(fam.key, { key: fam.key, label: fam.label, lineCounts: new Map(), dirs: new Map(), count: 0, seen: new Set() });
      const F = fams.get(fam.key);
      for (const [dep, rid, pos] of events) {
        const run = RUNS[rid];
        const enter = run[1], times = run[3];
        const n = times.length / 2;
        // 行き(折り返し駅より手前)の発車は、折り返し駅までを終点にする
        // (1本の運行は折り返して戻ってくるところまで続くが、乗客にとっては折り返し駅が終点)
        const segEnd = nextTurnIdx(lineIdx, enter + pos);
        const outbound = segEnd !== null;
        // 帰りの運行が路線の最後まで走る場合、列車は始発駅に戻って終点になる
        // (始発駅への到着時刻は run[5] に入っている)
        const wrapArr = run[5];
        const wraps = !outbound && wrapArr !== null && wrapArr !== undefined && enter + n - 1 >= stops.length - 1;
        let last = -1;
        for (let p = n - 1; p >= 0; p--) {
          const l2 = enter + p;
          if (outbound && l2 > segEnd) continue;
          if (l2 < stops.length && stops[l2] !== -1 && times[p * 2] !== null) { last = p; break; }
        }
        const firstSt = nearestRealStop(stops, 0, 1);
        let destIdx;
        if (wraps && firstSt !== null) {
          if (stops[enter + pos] === firstSt) continue;
          destIdx = firstSt;           // 最後の駅からも、始発駅へ向けて発車がある
        } else {
          if (pos >= last) continue;   // 終着駅では発車しない
          destIdx = stops[enter + last];
        }
        const key = dep + "|" + fam.kind + "|" + destIdx;
        if (F.seen.has(key)) continue; // 編成違いなどで同時刻・同行先が重なったものは1本にする
        F.seen.add(key);
        const label = dirLabel(stops, segEnd);
        if (!F.dirs.has(label)) F.dirs.set(label, { label, entries: [], sx: 0, sy: 0 });
        const G = F.dirs.get(label);
        G.entries.push({ dep, rid, pos, lineIdx, destIdx, kind: fam.kind, mask: run[4] });
        // 次に止まる駅へ向かう向き(単位ベクトル)を足し込む
        let nextSt = null;
        for (let p = pos + 1; p < n; p++) {
          const l2 = enter + p;
          if (l2 >= stops.length) break;
          if (stops[l2] !== -1 && stops[l2] !== sidx && times[p * 2] !== null) { nextSt = stops[l2]; break; }
        }
        if (nextSt === null && wraps && firstSt !== null) nextSt = firstSt;
        if (nextSt !== null && LL[sidx] && LL[nextSt]) {
          const dx = (LL[nextSt][0] - LL[sidx][0]) * Math.cos(LL[sidx][1] * Math.PI / 180);
          const dy = LL[nextSt][1] - LL[sidx][1];
          const len = Math.hypot(dx, dy);
          if (len > 0) { G.sx += dx / len; G.sy += dy / len; }
        }
        F.lineCounts.set(lineIdx, (F.lineCounts.get(lineIdx) || 0) + 1);
        F.count++;
      }
    }
    const out = [];
    for (const F of fams.values()) {
      if (!F.count) continue;
      // 同じ向きの方面(豊橋・浜松・岡崎 など)は1つにまとめる
      const groups = [...F.dirs.values()].sort((a, b) => b.entries.length - a.entries.length);
      const clusters = [];
      for (const g of groups) {
        const hasVec = Math.hypot(g.sx, g.sy) > 1e-9;
        let target = null;
        if (hasVec) {
          const ang = Math.atan2(g.sy, g.sx);
          for (const c of clusters) {
            if (Math.hypot(c.sx, c.sy) <= 1e-9) continue;
            let d = Math.abs(ang - Math.atan2(c.sy, c.sx));
            if (d > Math.PI) d = 2 * Math.PI - d;
            if (d < (60 * Math.PI) / 180) { target = c; break; }
          }
        }
        if (!target) { target = { labels: [], entries: [], sx: 0, sy: 0 }; clusters.push(target); }
        target.labels.push({ name: g.label.replace(/方面$/, ""), n: g.entries.length });
        target.entries.push(...g.entries);
        target.sx += g.sx; target.sy += g.sy;
      }
      const merged = new Map();
      for (const c of clusters) {
        c.labels.sort((a, b) => b.n - a.n);
        const names = [...new Set(c.labels.map(x => x.name))];
        let label = names.slice(0, 3).join("・") + (names.length > 3 ? "ほか" : "") + "方面";
        while (merged.has(label)) label += " ";
        merged.set(label, { label, entries: c.entries });
      }
      F.dirs = merged;
      let topLine = null, topN = -1;
      for (const [li, c] of F.lineCounts.entries()) if (c > topN) { topN = c; topLine = li; }
      F.color = LINES[topLine].col;
      out.push(F);
    }
    out.sort((a, b) => b.count - a.count);
    return out;
  }

  const stSel = { station: null, fam: null, dir: null };
  const stationInput = document.getElementById("station-input");
  const stationSuggest = document.getElementById("station-suggest");
  const stationResultsEl = document.getElementById("station-results");

  function setStation(idx) {
    stSel.station = idx; stSel.fam = null; stSel.dir = null;
    renderStationView();
  }
  setupAutocomplete(stationInput, stationSuggest, setStation);

  function renderStationView() {
    if (stSel.station === null) { stationResultsEl.innerHTML = ""; return; }
    const sidx = stSel.station;
    const fams = buildStationTimetable(sidx);
    const head = `<div class="panel">
      <div class="tt-header"><div class="tt-station-name">${escapeHtml(displayName(sidx))}</div></div>
      <div style="font-size:11.5px;color:var(--muted);">時刻をタップすると、その列車の停車駅が見られます</div>`;
    if (!fams.length) {
      stationResultsEl.innerHTML = head + `<div class="empty-state">この駅から発車する列車はありません</div></div>`;
      return;
    }
    if (!stSel.fam || !fams.some(f => f.key === stSel.fam)) { stSel.fam = fams[0].key; stSel.dir = null; }
    const fam = fams.find(f => f.key === stSel.fam);
    const dirs = [...fam.dirs.values()].sort((a, b) => b.entries.length - a.entries.length);
    if (!stSel.dir || !fam.dirs.has(stSel.dir)) stSel.dir = dirs[0].label;
    const dir = fam.dirs.get(stSel.dir);

    const famTabs = fams.map(f =>
      `<div class="tt-line-tab ${f.key === fam.key ? "active" : ""}" data-fam="${escapeHtml(f.key)}" style="background:${f.color};color:${textOn(f.color)}">${escapeHtml(f.label)}</div>`
    ).join("");
    const dirTabs = dirs.map(d =>
      `<div class="dir-btn ${d.label === dir.label ? "active" : ""}" data-dir="${escapeHtml(d.label)}">${escapeHtml(d.label)} <span style="font-weight:500;font-size:11px;">${d.entries.length}本</span></div>`
    ).join("");

    const byHour = new Map();
    dir.entries.forEach(e => {
      const h = Math.floor(e.dep / 60) % 24;
      if (!byHour.has(h)) byHour.set(h, []);
      byHour.get(h).push(e);
    });
    const hourOrder = [];
    for (let h = 4; h < 24; h++) hourOrder.push(h);
    for (let h = 0; h < 4; h++) hourOrder.push(h);
    const rows = hourOrder.filter(h => byHour.has(h)).map(h => {
      const items = byHour.get(h).sort((a, b) => a.dep - b.dep).map(e =>
        `<div class="min-entry" data-rid="${e.rid}" data-pos="${e.pos}">
          <span class="mm">${pad2(e.dep % 60)}</span>
          <span class="mt">${escapeHtml(e.kind)}</span>
          <span class="md">${escapeHtml(displayName(e.destIdx))}</span>
          ${runDaysNote(e.mask) ? `<span class="mw">${runDaysNote(e.mask)}</span>` : ""}
        </div>`
      ).join("");
      return `<div class="hour-block"><div class="hour-label">${h}</div><div class="hour-mins">${items}</div></div>`;
    }).join("");

    stationResultsEl.innerHTML = head +
      `<div class="tt-line-tabs">${famTabs}</div>
       <div class="dir-toggle">${dirTabs}</div>
       <div>${rows}</div></div>`;
  }

  stationResultsEl.addEventListener("click", (ev) => {
    const famEl = ev.target.closest("[data-fam]");
    if (famEl) { stSel.fam = famEl.dataset.fam; stSel.dir = null; renderStationView(); return; }
    const dirEl = ev.target.closest("[data-dir]");
    if (dirEl) { stSel.dir = dirEl.dataset.dir; renderStationView(); return; }
    const minEl = ev.target.closest(".min-entry");
    if (minEl) openRunDetail(parseInt(minEl.dataset.rid, 10), parseInt(minEl.dataset.pos, 10));
  });

  // その列車の、選んだ駅から先の停車駅と時刻
  function openRunDetail(rid, pos) {
    const run = RUNS[rid];
    const line = LINES[run[0]];
    const enter = run[1], times = run[3];
    const { name, cars } = trainLabel(run[2]);
    modalLineName.textContent = (line.co ? line.co + " " : "") + lineDisplayName(line);
    const daysNote = runDaysNote(run[4]);
    modalTrainName.textContent = (name || "") + (cars ? (name ? " ・ " : "") + cars + "両編成" : "") + (daysNote ? " ・ " + daysNote : "");
    const stops = line.s, n = times.length / 2;
    const segEnd = nextTurnIdx(run[0], enter + pos);
    const outbound = segEnd !== null;
    const rows = [];
    for (let p = pos; p < n; p++) {
      const li = enter + p;
      if (li >= stops.length) break;
      if (outbound && li > segEnd) break; // 次の折り返し駅が終点
      const sidx = stops[li];
      if (sidx === -1 || times[p * 2] === null) continue;
      rows.push({ sidx, arr: times[p * 2], dep: times[p * 2 + 1], first: p === pos });
    }
    const wrapArr = run[5];
    if (!outbound && wrapArr !== null && wrapArr !== undefined && enter + n - 1 >= stops.length - 1) {
      const firstSt = nearestRealStop(stops, 0, 1);
      if (firstSt !== null && (!rows.length || rows[rows.length - 1].sidx !== firstSt)) {
        rows.push({ sidx: firstSt, arr: wrapArr, dep: wrapArr, first: false });
      }
    }
    modalStops.innerHTML = rows.map((r, i) => {
      const cls = r.first ? "origin" : (i === rows.length - 1 ? "dest" : "");
      const t = r.first ? hhmm(r.dep) + " 発" : hhmm(r.arr);
      return `<div class="stop-row ${cls}"><div class="st-time">${t}</div><div class="st-dot"></div><div class="st-name">${escapeHtml(displayName(r.sidx))}</div></div>`;
    }).join("");
    modal.classList.add("show");
  }

})();

</script>
</body>
</html>
