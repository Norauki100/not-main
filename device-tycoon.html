<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スマホ帝国を作ろう！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f2ef;--panel:#ffffff;--deep:#f7f6f3;--ink:#1f1f1f;--sub:#6a6a6a;--mute:#9a9a9a;--line:#dddbd6;--acc:#2f5db0;--acc-ink:#ffffff;--acc-soft:#e6ecf7;--green:#2a8a5a;--red:#c23b3b;--gold:#b07d16;--bar:#c9a24a;
  --sky:#cfdcec;--ground:#b9b3a6;--bld:#e9e6df;--bld-line:#8f8a80;--roof:#8f6f5a;--door:#9fb2c9;--lit:#f2d27a;--dark:#a9b5c4;--ant:#c23b3b;--star:transparent}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#18191b;--panel:#212225;--deep:#1b1c1e;--ink:#e4e4e4;--sub:#9b9b9b;--mute:#6e6e6e;--line:#34363a;--acc:#6e98e0;--acc-ink:#111316;--acc-soft:#26303f;--green:#5cbf8b;--red:#e06a6a;--gold:#d9a845;--bar:#c9a24a;
  --sky:#151a26;--ground:#0f1116;--bld:#262a33;--bld-line:#4a505c;--roof:#3d3a40;--door:#3b4453;--lit:#e8c66a;--dark:#323844;--ant:#e06a6a;--star:#ffffff}}
:root[data-theme=dark]{--bg:#18191b;--panel:#212225;--deep:#1b1c1e;--ink:#e4e4e4;--sub:#9b9b9b;--mute:#6e6e6e;--line:#34363a;--acc:#6e98e0;--acc-ink:#111316;--acc-soft:#26303f;--green:#5cbf8b;--red:#e06a6a;--gold:#d9a845;--bar:#c9a24a;
  --sky:#151a26;--ground:#0f1116;--bld:#262a33;--bld-line:#4a505c;--roof:#3d3a40;--door:#3b4453;--lit:#e8c66a;--dark:#323844;--ant:#e06a6a;--star:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS 1p","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;line-height:1.6;font-size:15px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,26%);grid-template-rows:minmax(0,1fr) 22vh;gap:16px;padding:16px;height:calc(100vh - 46px)}
.layout.off{display:none}
.stage{grid-column:1;grid-row:1;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:8px}
.side{grid-column:2;grid-row:1/3;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:auto;display:flex;flex-direction:column}
.area3{grid-column:1;grid-row:2;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:12px;min-height:0}
.menu3{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;min-height:0}
.mbtn{background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:18px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px}
.devsum{padding:10px 14px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 20px;align-content:start}
.devsum .empty{align-self:center}
.ds .dt{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.ds .dt span{color:var(--sub);font-size:12.5px;white-space:nowrap}
.ds .prog{width:100%}
.mbtn:hover{border-color:var(--acc);color:var(--acc)}
.mbtn em{font-style:normal;font-weight:400;background:var(--acc-soft);color:var(--acc);border-radius:4px;padding:0 8px;font-size:12px}
.svgwrap{position:absolute;inset:0;background:var(--sky)}
.svgwrap svg{display:block;width:100%;height:100%}
.stage section{position:absolute;top:12px;max-height:calc(100% - 24px);overflow:auto;padding:12px 14px;background:color-mix(in srgb,var(--panel) 93%,transparent)}
.stage .goals{right:12px;width:270px}
.stage .news{right:294px;width:min(360px,calc(100% - 330px))}
.stage .log{max-height:none}
.bar{flex:1;display:flex;flex-direction:column;gap:14px;padding:16px}
.co small{display:block;color:var(--sub);font-size:12px}
.co b{display:block;font-size:19px;line-height:1.3}
.co span{display:block;color:var(--sub);font-size:12.5px}
.date{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.tc{display:flex;gap:8px;align-items:center}
.bar .tc .go{flex:1}
.kvs .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kvs .kv:last-child{border-bottom:0}
.kvs .kv span{color:var(--sub)}
.kvs .kv b{font-variant-numeric:tabular-nums}
.grow{flex:1}
.sub{display:none}
.sub.on{display:block}
.subbar{position:sticky;top:46px;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 16px}
.subbar h1{margin:0;font-size:18px}
.sk small{display:block;color:var(--sub);font-size:11px;line-height:1.3}
.sk b{font-variant-numeric:tabular-nums}
main{max-width:1400px;margin:0 auto;padding:16px}
@media(max-width:900px){
  .layout{display:flex;flex-direction:column;height:auto;padding:12px;gap:12px}
  .side{order:1}
  .stage{order:2;border:0;overflow:visible}
  .area3{order:3;display:flex;flex-direction:column}
  .menu3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mbtn{min-height:76px;font-size:16px}
  .svgwrap{position:relative;height:200px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .stage section,.stage .news,.stage .goals{position:static;width:auto;max-height:260px;margin:12px 0 0;background:var(--panel)}
  .two{grid-template-columns:1fr}
  main{padding:12px}
  .bar .grow{display:none}
}
.spd{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.spd button{background:var(--panel);border:0;border-left:1px solid var(--line);padding:7px 12px;font-weight:700;color:var(--sub)}
.spd button:first-child{border-left:0}
.spd button.on{background:var(--acc-soft);color:var(--acc)}
.go{background:var(--acc);border:1px solid var(--acc);color:var(--acc-ink);padding:8px 16px;border-radius:6px;font-weight:700}
.go:hover{filter:brightness(1.08)}
.go.alt{background:var(--panel);color:var(--ink);border-color:var(--line)}
.go.alt:hover{filter:none;border-color:var(--sub)}
.go.stop{background:var(--panel);color:var(--acc);border-color:var(--acc)}
.go.big{padding:12px 28px;font-size:16px}
.go:disabled{opacity:.4;cursor:not-allowed}
.page{display:none;gap:16px}
.page.on{display:grid}
.two{grid-template-columns:1.25fr 1fr;align-items:start}
.one{grid-template-columns:minmax(0,860px)}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;min-width:0}
h2{font-size:15px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);padding:5px 14px;border-radius:6px}
.tab.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.tab small{display:block;font-size:11px;color:var(--sub);line-height:1.2}
.row{margin-bottom:12px}
.row .lbl{font-size:13px;font-weight:700;margin-bottom:4px}
.row .lbl span{font-weight:400;color:var(--sub);margin-left:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.opt{border:1px solid var(--line);background:var(--panel);padding:6px 8px;border-radius:6px;text-align:left;font-size:12.5px;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--sub)}
.opt i{display:block;font-style:normal;color:var(--sub);font-size:11.5px;font-variant-numeric:tabular-nums}
.opt.on{border-color:var(--acc);background:var(--acc-soft)}
.opt.lock{opacity:.45;cursor:not-allowed}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin:6px 0}
.sum div small{display:block;color:var(--sub);font-size:11.5px}
.sum div b{font-variant-numeric:tabular-nums}
.lockt{color:var(--mute);font-weight:400;font-size:13px}
.pos{color:var(--green)}.neg{color:var(--red)}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=text],input[type=number]{width:100%;padding:8px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;font:inherit}
.fl{display:flex;gap:10px;align-items:end}
.fl>*{flex:1}
.fl .go{flex:0 0 auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:11.5px;color:var(--sub);font-weight:600}
.tbl{overflow-x:auto}
.empty{color:var(--sub);font-size:13px;margin:0}
.res{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.res:last-child{border-bottom:0}
.res small{color:var(--sub);display:block;line-height:1.45}
.res button{border:1px solid var(--acc);color:var(--acc);background:transparent;padding:5px 14px;border-radius:6px;font-size:12.5px;white-space:nowrap}
.res button:hover:not(:disabled){background:var(--acc-soft)}
.res button:disabled{border-color:var(--line);color:var(--mute);cursor:not-allowed}
.prog{height:6px;background:var(--line);border-radius:3px;margin-top:5px;width:190px;max-width:100%;overflow:hidden}
.prog div{height:100%;background:var(--acc)}
.dev{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:10px}
.dev .dt{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.dev .dt span{color:var(--sub);font-size:12.5px}
.dstats{display:flex;flex-wrap:wrap;gap:4px 22px;margin:6px 0 2px}
.dstats small{color:var(--sub);font-size:12px;margin-right:6px}
.dstats b{font-size:14px;font-variant-numeric:tabular-nums}
.dstats .bugs b{color:var(--red)}
.dev .prog{width:100%}
.dev .ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12.5px;color:var(--sub)}
.dev .ft button{border:1px solid var(--line);color:var(--ink);background:var(--panel);padding:4px 12px;border-radius:6px;font-size:12.5px}
.dev .ft button:hover:not(:disabled){border-color:var(--sub)}
.dev .ft button:disabled{color:var(--mute);cursor:not-allowed}
.log{max-height:420px;overflow:auto;font-size:13px}
.log p{margin:0;padding:5px 0;border-bottom:1px solid var(--line)}
.log p b{color:var(--sub);font-weight:400;margin-right:8px;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--sub);margin:0 0 8px}
.office{border-bottom:1px solid var(--line);padding:0 0 12px;margin-bottom:6px}
.office b{font-size:17px}
.office div{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:4px;font-size:13px;color:var(--sub)}
.h-sky{fill:var(--sky)}.h-star{fill:var(--star)}.h-ground{fill:var(--ground)}
.h-bld{fill:var(--bld);stroke:var(--bld-line)}.h-roof{fill:var(--roof)}.h-door{fill:var(--door)}
.h-lit{fill:var(--lit)}.h-dark{fill:var(--dark)}.h-ant{fill:var(--ant)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px 14px}
.kpis small{display:block;color:var(--sub);font-size:11.5px}
.kpis b{font-size:15px;font-variant-numeric:tabular-nums}
.goal{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.goal:last-child{border-bottom:0}
.goal i{font-style:normal;width:18px;height:18px;border-radius:3px;border:1px solid var(--sub);display:grid;place-items:center;font-size:12px;flex:0 0 auto}
.goal.done{color:var(--sub)}
.goal.done i{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:25;padding:14px}
#modal.on{display:grid}
.mbox{width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.mbox h3{margin:0 0 4px;font-size:18px}
.mbox .sub{color:var(--sub);font-size:13px;margin:0 0 10px}
.mbox .kv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.mbox .go{margin-top:14px;width:100%}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:92vw}
#toast.show{opacity:1}
.over{background:var(--red);color:#fff;padding:12px 16px;text-align:center;font-weight:700}
.over button{margin-left:12px;background:#fff;color:var(--red);border:0;padding:6px 14px;border-radius:6px;font-weight:700}
#title{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:var(--bg);overflow:auto}
#title.on{display:grid}
.tbox{padding:30px 18px;width:min(760px,100%)}
.thead{text-align:center;margin-bottom:28px}
.logo{font-size:clamp(34px,8vw,56px);font-weight:900;line-height:1.2;letter-spacing:.02em;color:var(--ink);margin-bottom:8px}
.tcols{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start}
@media(max-width:640px){.tcols{grid-template-columns:1fr}}
.tdata h2{margin-bottom:8px}
.tdata .kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.tdata .kv:last-child{border-bottom:0}
.tdata .kv span{color:var(--sub)}
.tdata .kv b{font-variant-numeric:tabular-nums;text-align:right}
.tmenu{display:flex;flex-direction:column;gap:10px}
.tmenu .go{width:100%}
.tmenu label{text-align:left;font-weight:700;font-size:13px}
.tmenu .opt{text-align:center;padding:9px 8px;font-size:14px}
.pr{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.pr input{max-width:220px;font-variant-numeric:tabular-nums}
.pr span{color:var(--sub);font-size:13px}
.rep{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:14px}
.rep .dt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;margin-bottom:8px}
.rep .dt span{color:var(--sub);font-size:12.5px}
.rb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin:2px 0}
.rb u{text-decoration:none;width:34px;color:var(--gold)}
.rb i{flex:1;height:8px;background:var(--line);border-radius:2px;overflow:hidden}
.rb i b{display:block;height:100%;background:var(--bar)}
.rb em{font-style:normal;width:36px;text-align:right;font-variant-numeric:tabular-nums}
.cm{padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.cm .st{color:var(--gold);letter-spacing:1px}
.cm small{color:var(--sub);margin-left:6px}
.sub2{margin:12px 0 6px;font-size:12.5px;color:var(--sub);font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ver{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--line);vertical-align:-1px;margin-right:6px}
#pg-dev{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.viewer{position:sticky;top:122px;height:calc(100vh - 154px);padding:0;overflow:hidden}
.viewer canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.viewer canvas:active{cursor:grabbing}
.vmsg{position:absolute;inset:0;display:grid;place-items:center;margin:0;color:var(--sub);font-size:13px;pointer-events:none}
.vhint{position:absolute;left:12px;right:12px;bottom:8px;margin:0;color:var(--mute);font-size:12px;pointer-events:none}
@media(max-width:900px){#pg-dev{grid-template-columns:1fr}.viewer{position:relative;top:0;height:340px}}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 14px;overflow-x:auto}
.dtab{border:0;background:none;padding:8px 14px;font-weight:700;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap}
.dtab:hover{color:var(--ink)}
.dtab.on{color:var(--ink);border-bottom-color:var(--acc)}
.ccol{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.ccol input{width:56px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.topbar{position:sticky;top:0;z-index:6;height:46px;display:flex;align-items:center;gap:28px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.tk{display:flex;align-items:baseline;gap:8px}
.tk small{color:var(--sub);font-size:12px}
.tk b{font-size:17px;font-variant-numeric:tabular-nums}
.tk em{font-style:normal;color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
.res button.fire,.res button[data-act=fire]{border-color:var(--line);color:var(--sub)}
.vtools{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:60%}
.vside{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12.5px}
.vside .tab{padding:3px 10px;font-size:12.5px}
</style>
</head>
<body>
<div id="title"><div class="tbox"><div class="thead"><div class="logo">スマホ帝国を<br>作ろう！</div><div class="ver" id="ver"></div></div><div class="tcols"><section class="tdata" id="tdata"></section><section class="tmenu" id="tmenu"></section></div></div></div>
<div class="topbar" id="topbar"></div>
<div class="layout" id="home">
<div class="stage">
  <div class="svgwrap" id="hero"></div>
  <section class="news" id="homeNews"></section>
  <section class="goals" id="goals"></section>
</div>
<aside class="side"><div id="overBox"></div><div class="bar" id="bar"></div></aside>
<div class="area3"><nav class="menu3" id="nav"></nav><section class="devsum" id="devSum"></section></div>
</div>
<div class="sub" id="sub">
<header class="subbar" id="subbar"></header>
<main>
  <div class="page two" id="pg-dev">
    <section class="viewer" id="viewer"><p class="vmsg" id="vmsg">3Dモデルを読み込み中…</p><p class="vhint">ドラッグで回転</p><div class="vtools" id="vtools"></div></section>
    <section id="design"></section>
  </div>
  <div class="page two" id="pg-works">
    <section id="salesBox"><h2>開発中・販売中</h2><div id="salesHead"></div><div id="devList"></div><div id="salesTbl"></div></section>
    <section id="pastBox"></section>
  </div>
  <div class="page one" id="pg-res"><section id="research"><h2>研究</h2><div id="resHead"></div><div id="resActive"></div><div id="resList"></div></section></div>
  <div class="page one" id="pg-office"><section id="office"></section></div>
  <div class="page one" id="pg-rep"><section id="repBox"></section></div>
  <div class="page two" id="pg-market">
    <section id="market"></section>
    <section id="logBox"></section>
  </div>
</main>
</div>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

<script>
const VERSION='1.0.11';
const TYPES={
  phone:{name:'スマホ',base:8000,market:200,w:[.22,.22,.17,.17,.08,.08,.06],dev:2,unlock:0,pre:'P'},
  tablet:{name:'タブレット',base:12000,market:120,w:[.30,.22,.20,.04,.08,.08,.08],dev:2,unlock:800000,pre:'T'},
  laptop:{name:'ノートPC',base:20000,market:80,w:[.17,.33,.15,.04,.12,.05,.14],dev:3,unlock:2500000,pre:'L'}
};
const CATS=[

function dLock(type,parts,k,i){

    if(!lap&&dv(parts,'jack')===0)return 'イヤホンジャックがあると作れない';

  if(k==='fcam'){
    if(lap&&i>1)return 'ノートPCでは使えない';
    if(type==='tablet'&&i===2)return 'タブレットでは使えない';
    if(i===0&&dv(parts,'bezel')>1)return 'ベゼルが細すぎる';

    const order=pref||[...Array(n).keys()].reverse();
    const ok=order.find(i=>!dLock(type,parts,k,i));parts[k]=ok==null?0:ok;
  };
  fix('jack',2);fix('thick',THICK.length,[1,0,2,3]);
  const m=parts.material||0;if((parts.color||0)>COLORS[m].length)parts.color=COLORS[m].length;fix('finish',FINISH[m].length,[0,1,2]);fix('color',COLORS[m].length+1,[0,1,2,3,4,5,6]);

}

  const pf=clamp(Math.pow(refPrice(p.q)/p.price,2),0,3);
  let tm=1;
  if(S.trend){const tier=p.parts[S.trend.cat]||0;tm=tier>=3?1.35:tier<=1?.8:1}
  const rf=clamp(.55+(p.q/S.rival.q)*.45,.5,1.4);
  const decay=Math.exp(-p.age/150);
  const gm=[1,1.25,1.5,2][techLv('global')];
  const ad=1+.08*techLv('ads');
  const bf=Math.max(.5,1-(p.bugs||0)*.012);
  const wom=(p.rvN||0)>=10?clamp(1+(userAvg(p)-3)*.1,.8,1.2):1;
  return T.market*gm*ad*(.6+S.fans/500)*Math.pow(p.q/40,1.5)*pf*tm*rf*decay*bf*wom*rnd;
}
function userAvg(p){
  if(!p.rvN)return 0;
  let t=0;p.stars.forEach((c,i)=>{t+=c*(i+1)});return t/p.rvN;
}
const POS={screen:'画面がとてもきれい',cpu:'動作がサクサクで快適',battery:'電池が長持ちする',camera:'写真がきれいに撮れる',material:'質感が高級',comm:'通信が速くて安定している',storage:'容量に余裕があって安心'};
const NEG={screen:'画面が粗くて見づらい',cpu:'動作がもたつく',battery:'電池がすぐなくなる',camera:'カメラが物足りない',material:'作りが安っぽい',comm:'通信が遅い',storage:'容量がすぐいっぱいになる'};
const NICK=['たろう','ゆき','けん','みさき','Haru','Sora','mika','りく','あおい','Ken','さくら','tomo'];
function genReview(p){
  const ratio=refPrice(p.q)/p.price;
  const exp=clamp(1+p.review/10*4+clamp((ratio-1)*1.2,-1.2,1)*.8-Math.min(1.2,p.bugs*.06)*.5,1,5);
  const stars=clamp(Math.round(exp+(Math.random()-.5)*2.2),1,5);
  const pos=[],neg=[];
  CATS.forEach(c=>{const t=p.parts[c.id]||0;if(t>=3)pos.push(POS[c.id]);if(t<=1)neg.push(NEG[c.id])});
  if(p.bugs>=8)neg.push('バグが多くてよく固まる');else if(p.bugs<=2)pos.push('不具合がほとんどなく安定している');
  if(ratio<.87)neg.push('値段が高すぎる');else if(ratio>1.25)pos.push('この価格ならコスパが良い');
  if(p.q<S.rival.q*.8)neg.push(S.rival.name+'の新型の方が良さそう');
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  let text;
  if(stars>=4)text=pos.length?pick(pos):'満足して使っている';
  else if(stars<=2)text=neg.length?pick(neg):'期待外れだった';
  else if(pos.length&&neg.length)text=pick(pos)+'。でも'+pick(neg);
  else text=pos.length?pick(pos):neg.length?pick(neg):'値段相応だと思う';
  p.stars[stars-1]++;p.rvN++;
  p.rvs.unshift({s:stars,t:text,n:pick(NICK)+Math.floor(Math.random()*90+10),d:S.day});
  if(p.rvs.length>12)p.rvs.length=12;
}
function addLog(t){S.log.unshift({d:S.day,t});if(S.log.length>80)S.log.length=80}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),2600)}
function defaultPrice(){const s=S.sel;return Math.round(refPrice(quality(s.type,s.parts))*.95/1000)*1000}
function checkGoals(){GOALS.forEach(g=>{if(!S.goals[g.id]&&g.ok()){S.goals[g.id]=1;addLog('目標達成: '+g.name);toast('目標達成: '+g.name)}})}

function tickDay(){
  const ev={msgs:[],released:[],research:false};
  const say=m=>{ev.msgs.push(m);addLog(m)};
  S.day++;
  S.dev=S.dev.filter(d=>{
    d.left--;
    d.score+=d.target/d.total*(.6+Math.random()*.8)*(1+.08*S.office);
    let b=.2+d.q/150;
    while(b>0){if(Math.random()<Math.min(1,b))d.bugs++;b-=1}
    if(d.left>0)return true;
    const r=d.score/d.target;
    const qe=d.q*clamp(.8+.2*r,.85,1.1);
    const rv=clamp(review(qe,d.price)-d.bugs*.08,1,10);
    const p={id:d.id,name:d.name,type:d.type,parts:d.parts,q:qe,q0:d.q,price:d.price,cost:d.cost,age:0,total:0,mUnits:0,last:0,carry:0,
      review:rv,bugs:d.bugs,score:Math.round(d.score),target:d.target,stars:[0,0,0,0,0],rvs:[],rvN:0,rvCarry:0};
    S.sales.push(p);S.released++;ev.released.push(p);
    say('「'+d.name+'」を発売。レビュー '+rv.toFixed(1)+' / 10(バグ '+d.bugs+'件)');
    return false;
  });
  const ds=S.sales.map(p=>Math.max(0,demand(p,.7+Math.random()*.6))/30);
  const D=ds.reduce((a,b)=>a+b,0),C=cap()/30,f=D>C?C/D:1;
  let rev=0,cogs=0,units=0;
  const fanMul=(1+.3*S.fac.pr)*(1+.08*techLv('ads'));
  S.sales.forEach((p,i)=>{
    const raw=ds[i]*f+p.carry,u=Math.floor(raw);
    p.carry=raw-u;p.mUnits+=u;p.total+=u;
    rev+=u*p.price;cogs+=u*p.cost*costMult();units+=u;
    S.fans+=Math.max(0,u*.03*(p.review-4.5))*fanMul;
    p.rvCarry+=u/15;
    for(let k=0;k<3&&p.rvCarry>=1;k++){genReview(p);p.rvCarry-=1}
    if(p.rvCarry>3)p.rvCarry=3;
    p.age++;
  });
  const sup=[0,40,90,160][techLv('support')]*S.fans/30;
  const fixed=fixedCost()/30;
  S.money+=rev+sup-cogs-fixed;S.totalUnits+=units;
  const m=S.mon;
  m.rev+=rev+sup;m.sup+=sup;m.cogs+=cogs;m.fixed+=fixed;m.units+=units;m.demand+=D;m.lost+=D*(1-f);
  S.rp+=rpPerDay();
  S.research=S.research.filter(r=>{
    r.left--;
    if(r.left>0)return true;
    if(r.kind==='part'){S.unl[r.cat]=r.tier}else{S.tech[r.id]=r.lv}
    say('研究完了: '+r.name);ev.research=true;
    return false;
  });
  if(S.day%30===0)monthEnd(say);
  if(S.money<0&&!S.over){S.over=true;say('資金が尽きました')}
  return ev;
}
function monthEnd(say){
  const m=S.mon,net=m.rev-m.cogs-m.fixed;
  S.last={rev:m.rev,cogs:m.cogs,fixed:m.fixed,net,units:m.units,sup:m.sup,demand:Math.round(m.demand),lost:Math.round(m.lost),cap:cap()};
  addLog('今月の収支 '+fmt(net)+'(売上 '+fmt(m.rev)+' / 原価 '+fmt(m.cogs)+' / 固定費 '+fmt(m.fixed)+')');
  if(S.last.lost>=10)say('今月は生産が追いつかず '+S.last.lost.toLocaleString()+'台 売り逃した(生産能力 '+cap()+'台/月)');
  S.sales=S.sales.filter(p=>{
    p.last=p.mUnits;
    const dead=p.age>=120&&p.mUnits<3;
    p.mUnits=0;
    if(dead){
      say('「'+p.name+'」の販売を終了(累計 '+Math.round(p.total).toLocaleString()+'台)');
      S.retired.unshift({name:p.name,type:p.type,parts:p.parts,q:p.q,price:p.price,bugs:p.bugs,total:Math.round(p.total),review:p.review,avg:userAvg(p),n:p.rvN,end:S.day});
    }
    return !dead;
  });
  if(S.trend){
    S.trend.left--;
    if(S.trend.left<=0){say('「'+CATS.find(c=>c.id===S.trend.cat).name+'」のブームが落ち着いてきた');S.trend=null}
  }else if(Math.random()<.18){
    const c=CATS[Math.floor(Math.random()*CATS.length)];
    S.trend={cat:c.id,left:2+Math.floor(Math.random()*7)};
    say('世間で「'+c.name+'」が話題になっている');
  }
  S.rival.q+=.4+Math.random()*.2;
  if((S.day/30)%6===0){
    S.rival.name=RIVALS[Math.floor(Math.random()*RIVALS.length)];
    say(S.rival.name+'が新型フラッグシップを発表(品質 '+S.rival.q.toFixed(0)+')');
  }
  if(!S.top&&S.money>=1e9)S.top=true;
  newCands();
  S.mon=newMon();
  save();
}

function schedule(){
  clearInterval(timer);timer=null;
  if(playing)timer=setInterval(stepDay,DAY_MS/S.speed);
}
function setPlaying(v){
  if(v&&S.over)return;
  const was=playing;
  playing=!!v;schedule();updateBar();
  if(was&&!playing)save();
}
function stepDay(){
  if(!playing||S.over)return;
  const ev=tickDay();
  checkGoals();
  if(ev.research)renderDesign();
  renderLive();
  if(ev.released.length){setPlaying(false);showRelease(ev.released[0])}
  else if(S.over){setPlaying(false)}
  else if(ev.msgs.length)toast(ev.msgs[ev.msgs.length-1]);
}

  for(let i=0;i<56;i++)s+='<circle cx="'+((i*163+29)%900)+'" cy="'+((i*37)%90+6)+'" r="'+(i%3?0.8:1.3)+'" class="h-star" opacity="'+(i%2?.5:.85)+'"/>';

      s+='<rect x="'+(b.x+12)+'" y="'+(y+6)+'" width="'+(b.w-24)+'" height="'+(h-6)+'" class="h-door"/>';
      s+='<rect x="'+(b.x+b.w-26)+'" y="'+(y+10)+'" width="10" height="8" class="h-lit"/>';

let T=null;
const V={loading:false,failed:false,ready:false,key:'',type:'',rx:0,ry:0,group:null};

function loadThree(){
  if(V.loading)return;V.loading=true;
  import(THREE_URL).then(mod=>{T=mod;initViewer();updateModel()}).catch(()=>{
    V.failed=true;const m=document.getElementById('vmsg');
    if(m)m.textContent='3Dモデルを読み込めませんでした(インターネット接続が必要です)';
  });
}

function initViewer(){
  const box=document.getElementById('viewer');
  const r=new T.WebGLRenderer({antialias:true,alpha:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1;
  box.prepend(r.domElement);
  const scene=new T.Scene();
  const pm=new T.PMREMGenerator(r);
  scene.environment=pm.fromScene(studioRoom(),0.03).texture;
  const sun=new T.DirectionalLight(0xffffff,1.1);sun.position.set(3,5,4);scene.add(sun);
  const cam=new T.PerspectiveCamera(28,1,0.01,100);
  Object.assign(V,{r,scene,cam,box,ready:true});
  const msg=document.getElementById('vmsg');if(msg)msg.textContent='';
  new ResizeObserver(()=>resizeView()).observe(box);
  let drag=null;
  const rc=new T.Raycaster();
  const ray=e=>{const b=r.domElement.getBoundingClientRect();rc.setFromCamera(new T.Vector2((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1),V.cam)};
  const hitLocal=(e,normal,point)=>{
    ray(e);V.group.updateMatrixWorld();
    const n=normal.clone().transformDirection(V.group.matrixWorld),p=V.group.localToWorld(point.clone());
    const out=new T.Vector3();if(!rc.ray.intersectPlane(new T.Plane().setFromNormalAndCoplanarPoint(n,p),out))return null;
    return V.group.worldToLocal(out);
  };
  const planeFor=o=>{const u=V.group.userData;
    if(o.userData.drag==='cam')return [new T.Vector3(0,0,1),new T.Vector3(0,0,u.zb)];
    if(o.userData.side==='t')return [new T.Vector3(0,1,0),new T.Vector3(0,u.H/2,0)];
    return [new T.Vector3(1,0,0),new T.Vector3((o.userData.side==='r'?1:-1)*u.W/2,0,0)];
  };
  r.domElement.addEventListener('pointerdown',e=>{
    r.domElement.setPointerCapture(e.pointerId);
    if(V.edit&&V.group){
      ray(e);
      const hit=rc.intersectObjects(V.group.children,true)[0];
      let o=hit&&hit.object;while(o&&!o.userData.drag&&o.parent!==V.group)o=o.parent;
      if(o&&o.userData.drag){
        const [n,pt]=planeFor(o),h=hitLocal(e,n,pt);
        if(h){
          if(o.userData.drag==='btn'&&V.selBtn!==o.userData.i){V.selBtn=o.userData.i;V.key='';updateModel();renderVtools();
            o=V.group.children.find(c=>c.userData.drag==='btn'&&c.userData.i===V.selBtn)}
          drag={obj:o,start:h,pos:o.position.clone(),n,pt};return;
        }
      }
    }
    drag={x:e.clientX,y:e.clientY,rx:V.rx,ry:V.ry};
  });
  r.domElement.addEventListener('pointermove',e=>{
    if(!drag)return;
    if(drag.obj){
      const h=hitLocal(e,drag.n,drag.pt);if(!h)return;
      const o=drag.obj,d=h.sub(drag.start);
      if(o.userData.drag==='cam'){
        const L=o.userData.lim,u=V.group.userData;
        const nx=clamp(L.cx+drag.pos.x+d.x,-L.x,L.x),ny=clamp(L.cy+drag.pos.y+d.y,-L.y,L.y);
        o.position.set(nx-L.cx,ny-L.cy,0);
      }else if(o.userData.side==='t')o.position.x=clamp(drag.pos.x+d.x,-o.userData.lim,o.userData.lim);
      else o.position.y=clamp(drag.pos.y+d.y,-o.userData.lim,o.userData.lim);
      drawView();return;
    }
    V.ry=drag.ry+(e.clientX-drag.x)*0.01;
    V.rx=clamp(drag.rx+(e.clientY-drag.y)*0.01,-1.3,1.3);
    if(V.group)V.group.rotation.set(V.rx,V.ry,0);
    drawView();
  });
  const end=()=>{
    if(drag&&drag.obj){
      const o=drag.obj,P=S.sel.parts;
      if(o.userData.drag==='cam'){const L=o.userData.lim;P.camX=L.cx+o.position.x;P.camY=L.cy+o.position.y}
      else{const bl=btnList(S.sel.type,P);bl[o.userData.i].p=o.userData.side==='t'?o.position.x:o.position.y;P.btns=bl}
      drag=null;renderDesign();return;
    }
    drag=null;
  };
  r.domElement.addEventListener('pointerup',end);r.domElement.addEventListener('pointercancel',end);
  resizeView();
}
function studioRoom(){
  const s=new T.Scene();
  const wall=new T.Mesh(new T.BoxGeometry(20,12,20),new T.MeshBasicMaterial({color:0x3a3a3a,side:T.BackSide}));
  s.add(wall);
  const panel=(w,h,v,pos,rot)=>{
    const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:new T.Color().setScalar(v),side:T.DoubleSide}));
    m.position.set(...pos);m.rotation.set(...rot);s.add(m);
  };
  panel(10,6,7,[0,5.8,0],[Math.PI/2,0,0]);
  panel(6,4,4,[-9.8,2,1],[0,Math.PI/2,0]);
  panel(5,5,3,[9.8,1,-2],[0,-Math.PI/2,0]);
  panel(8,3,1.6,[0,1,9.8],[0,Math.PI,0]);
  return s;
}
function resizeView(){
  if(!V.ready)return;
  const w=V.box.clientWidth,h=V.box.clientHeight;
  if(!w||!h)return;
  V.r.setSize(w,h,false);V.cam.aspect=w/h;V.cam.updateProjectionMatrix();
  frameView();drawView();
}
function drawView(){if(V.ready&&V.box.clientWidth)V.r.render(V.scene,V.cam)}
function frameView(){
  if(!V.group)return;
  const rot=V.group.rotation.clone();V.group.rotation.set(0,0,0);
  const sp=new T.Box3().setFromObject(V.group).getBoundingSphere(new T.Sphere());
  V.group.rotation.copy(rot);
  const f=V.cam.fov*Math.PI/360;
  const fit=sp.radius/Math.sin(Math.min(f,Math.atan(Math.tan(f)*V.cam.aspect)));
  V.cam.near=fit*.3;V.cam.far=fit*4;V.cam.updateProjectionMatrix();
  V.cam.position.set(sp.center.x,sp.center.y,sp.center.z+fit*1.08);
  V.cam.lookAt(sp.center);
}

function updateModel(){
  if(V.failed)return;
  if(!T){loadThree();return}
  if(!V.ready)return;
  const s=S.sel;
  if(!S.owned[s.type]){if(V.group){V.scene.remove(V.group);disposeTree(V.group);V.group=null;V.key=''}drawView();return}
  const key=s.type+JSON.stringify(s.parts);
  if(key===V.key){resizeView();return}
  V.key=key;
  if(V.group){V.scene.remove(V.group);disposeTree(V.group)}
  if(V.type!==s.type){
    V.type=s.type;
    if(s.type==='laptop'){V.rx=0.42;V.ry=-0.55}else{V.rx=0.12;V.ry=-0.45}
  }
  const g=s.type==='laptop'?buildLaptop(s.parts):buildSlate(s.type,s.parts);
  g.scale.setScalar(0.01);g.rotation.set(V.rx,V.ry,0);
  V.group=g;V.scene.add(g);
  renderVtools();
  resizeView();
}
function disposeTree(o){
  o.traverse(c=>{
    if(c.geometry)c.geometry.dispose();
    if(c.material){if(c.material.map)c.material.map.dispose();c.material.dispose()}
  });
}

function rrShape(w,h,r){
  const s=new T.Shape(),x=-w/2,y=-h/2;r=Math.max(0.01,Math.min(r,w/2,h/2));
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.absarc(x+w-r,y+r,r,-Math.PI/2,0,false);
  s.lineTo(x+w,y+h-r);s.absarc(x+w-r,y+h-r,r,0,Math.PI/2,false);
  s.lineTo(x+r,y+h);s.absarc(x+r,y+h-r,r,Math.PI/2,Math.PI,false);
  s.lineTo(x,y+r);s.absarc(x+r,y+r,r,Math.PI,Math.PI*1.5,false);
  return s;
}
function slab(w,h,r,d,bev){

  g.translate(0,0,-(d-2*bev)/2);

}
function flat(w,h,r){
  const g=new T.ShapeGeometry(rrShape(w,h,r),32);
  const p=g.attributes.position,uv=g.attributes.uv;
  for(let i=0;i<p.count;i++)uv.setXY(i,(p.getX(i)+w/2)/w,(p.getY(i)+h/2)/h);

}
function disc(r,h){const g=new T.CylinderGeometry(r,r,h,48);g.rotateX(Math.PI/2);return g}
function mesh(g,m,x,y,z){const o=new T.Mesh(g,m);o.position.set(x||0,y||0,z||0);return o}
function phys(color,o){return new T.MeshPhysicalMaterial(Object.assign({color:new T.Color(color)},o))}

function looks(parts){
  const L=lookOf(parts),f=L.finish[3],col=L.color[1];
  const surf=o=>{const m=phys(col,Object.assign({metalness:f.m,roughness:f.r,clearcoat:f.cc,clearcoatRoughness:.08},o||{}));if(L.finish[0]==='ヘアライン'){m.anisotropy=.7}return m};
  let body,back,frame;
  if(L.m===2){
    frame=phys(col,{metalness:1,roughness:.22});frame.color.lerp(new T.Color('#d0d0d4'),.45);
    back=surf();body=frame;
  }else if(L.m===3){
    frame=surf();back=phys(col,{metalness:0,roughness:.5,clearcoat:.2});body=frame;
  }else{
    body=surf();back=body;frame=body;
  }
  return {L,body,back,frame};
}
const DARK=()=>phys('#0d0d0f',{metalness:.2,roughness:.4});
const COVER=mat=>phys('#050506',mat?{metalness:0,roughness:.38}:{metalness:0,roughness:.03,clearcoat:1});

function buildSlate(type,parts){
  const g=new T.Group(),M=looks(parts),L=M.L;
  const tab=type==='tablet';
  const W=tab?179.5:71.6,H=tab?247.6:147.6;
  const R=(tab?[7,13,18]:[5,10,14])[dv(parts,'corner')];
  const D=L.thick.mm[type],bev=dv(parts,'frame')===0?Math.min(D*.12,.7):D*.42;
  const zf=D/2,zb=-D/2;
  g.add(mesh(slab(W,H,R,D,bev),M.body));
  if(M.back!==M.body){
    const p=mesh(flat(W-2*bev,H-2*bev,R-bev),M.back,0,0,zb-0.06);p.rotation.y=Math.PI;g.add(p);
  }
  const mat=dv(parts,'glass')===1,fpv=dv(parts,'fp');
  g.add(mesh(flat(W-bev*1.2,H-bev*1.2,Math.max(1,R-bev*.6)),COVER(mat),0,0,zf+0.08));
  const bl=dv(parts,'bezel');
  const bz=(tab?[[18,18],[12,12],[7.5,7.5],[5,5]]:[[4.4,10],[3.2,6],[2,2.4],[1.2,1.5]])[bl];
  const dw=W-2*bz[0],dh=H-2*bz[1],dr=bl===0?1:Math.max(1,R-bz[0]-1);
  g.add(mesh(flat(dw,dh,dr),screenTex(dw,dh,tab?'tab':'phone',fpv>=3),0,0,zf+0.18));
  g.add(mesh(flat(dw,dh,dr),SCREEN_FILM(mat),0,0,zf+0.22));
  frontCam(g,dv(parts,'fcam'),W,H,bz,zf,tab?1.15:1,bev,dv(parts,'face')===2);
  const bd=Math.min(3,D*.45),bm=M.frame;
  const pw=fpv===2?phys(darker(L.color[1],.55),{metalness:.4,roughness:.3}):bm,pl=fpv===2?20:17;
  const u=tab?1.3:1;
  g.userData={W,H,zb,R,btn:[]};
  btnList(type,parts).forEach((b,i)=>{
    const len=(b.k==='pw'?pl:11)*u,m=V.edit&&V.selBtn===i?phys('#2f6fd8',{roughness:.3}):b.k==='pw'?pw:bm;
    const lim=(b.s==='t'?W:H)/2-len/2-R*.7,p=clamp(b.p,-lim,lim);
    const o=b.s==='t'?mesh(new T.BoxGeometry(len,1.2,bd),m,p,H/2+0.25,0):mesh(new T.BoxGeometry(1.2,len,bd),m,(b.s==='r'?1:-1)*(W/2+0.25),p,0);
    o.userData={drag:'btn',i,lim,side:b.s};g.add(o);
  });
  const pt=dv(parts,'port');
  if(pt===0)g.add(mesh(new T.BoxGeometry(7.2,1.2,Math.min(2.3,D*.42)),DARK(),0,-H/2+0.2,0));
  else{const pc=mesh(slab(8.6,Math.min(2.8,D*.48),Math.min(1.4,D*.24),1.4,.1),DARK(),0,-H/2+0.3,0);pc.rotation.x=Math.PI/2;g.add(pc)}
  if(dv(parts,'jack')===0){const j=mesh(new T.CylinderGeometry(1.8,1.8,1.4,24),DARK(),tab?W/2-50:-17,tab?H/2-0.3:-H/2+0.3,0);g.add(j)}
  const hole=(x,y)=>g.add(mesh(new T.CylinderGeometry(.6,.6,1.2,12),DARK(),x,y,0));
  if(tab)[-1,1].forEach(sx=>[H/2,-H/2].forEach(y=>{for(let i=0;i<5;i++)hole(sx*(W/2-30-i*3),y)}));
  else [-1,1].forEach(sx=>{for(let i=0;i<5;i++)hole(sx*(10+i*2.6),-H/2+0.1)});
  if(L.m>=1&&L.m<=3){
    const am=phys('#'+new T.Color(L.color[1]).multiplyScalar(.62).getHexString(),{roughness:.55});
    const n=[2,4,6,8][dv(parts,'ant')],yy=H/2-18*u,xx=W/2-14*u;
    const spots=[[1,yy,'s'],[-1,-yy,'s'],[-1,yy,'s'],[1,-yy,'s'],[-xx,1,'t'],[xx,-1,'t'],[xx,1,'t'],[-xx,-1,'t']];
    spots.slice(0,n).forEach(([a,c,k])=>{
      if(k==='s')g.add(mesh(new T.BoxGeometry(.6,1.4,D*.86),am,a*(W/2-0.05),c,0));
      else g.add(mesh(new T.BoxGeometry(1.4,.6,D*.86),am,a,c*(H/2-0.05),0));
    });
    if(L.m===1){
      [H/2-13,-H/2+13].forEach(y=>{const p=mesh(flat(W-2*bev,1.3,.2),am,0,y,zb-0.12);p.rotation.y=Math.PI;g.add(p)});
    }
  }
  const camBottom=addCameras(g,M,parts,W,H,zb,tab);
  if(fpv===1){
    const y=Math.min(H*.13,camBottom-14*u);
    g.add(mesh(disc(5.8*u,.3),phys(darker(L.color[1],.7),{metalness:.6,roughness:.3}),0,y,zb-.12));
    g.add(mesh(disc(5*u,.3),phys(darker(L.color[1],.45),{roughness:.55}),0,y,zb-.2));

}
function frontCam(g,fc,W,H,bz,zf,u,bev,face3d){
  const yt=H/2-bz[1],z=zf+0.28;
  const black=phys('#000000',{roughness:.25}),lens=phys('#141c30',{metalness:.6,roughness:.12});
  const slit=(y,w)=>g.add(mesh(flat(w,1.2,.6),DARK(),0,y,z));
  if(fc===0){
    if(bz[1]>=5){slit(H/2-bz[1]/2,11*u);g.add(mesh(disc(1.5*u,.2),lens,-12*u,H/2-bz[1]/2,z))}
    else g.add(mesh(disc(1.5*u,.2),lens,0,H/2-bz[1]/2,z));
  }else if(fc===1){
    const nw=34*u,nh=5.8*u;
    g.add(mesh(flat(nw,nh+2,2.6),black,0,yt-nh/2+1,z));
    slit(yt-nh/2+.6,9*u);g.add(mesh(disc(1.4*u,.2),lens,8*u,yt-nh/2+.4,z+.05));
    if(face3d)[-8,-12.5,12.5].forEach(x=>g.add(mesh(disc(1.1*u,.2),lens,x*u,yt-nh/2+.4,z+.05)));
  }else if(fc===2){
    const r=3.4*u;
    g.add(mesh(disc(r,.2),black,0,yt-r,z));g.add(mesh(flat(r*2,r,.1),black,0,yt-r/2,z));
    g.add(mesh(disc(1.3*u,.2),lens,0,yt-r,z+.12));
    slit(H/2-bev*.8,12*u);
  }else if(fc===3){
    g.add(mesh(disc(1.8*u,.2),black,0,yt-5*u,z));
    slit(H/2-bev*.8,12*u);
  }else{
    g.add(mesh(disc(1.9*u,.2),phys('#ffffff',{roughness:1,transparent:true,opacity:.07}),0,yt-5*u,z));
    slit(H/2-bev*.8,12*u);
  }
}
function addCameras(g,M,parts,W,H,zb,tab){
  const c=parts.camera||0,shape=dv(parts,'camShape'),G=g;g=new T.Group();g.userData.drag='cam';
  const mps=MP_SCALE[dv(parts,'mp')];
  let k=tab?.9:1;const mg=tab?9:7;
  const ring=phys('#8a8c90',{metalness:1,roughness:.25});
  const glass=phys('#0b0d12',{metalness:.3,roughness:.05,clearcoat:1});
  const iris=phys('#2b3a5e',{metalness:.7,roughness:.12});
  const flash=phys('#f2ead6',{roughness:.45});
  const bumpMat=M.L.m===0||M.L.m===1||M.L.m===4?M.body:M.back;
  const n=[1,2,3,4,4][c],peri=c===4,base=[4.2,5,6.2,6.4,6.4][c];
  const rs=[];for(let i=0;i<n;i++)rs.push(i===0?(c===3?8:base)*mps:base*(1+(mps-1)*.5));
  const rmax=Math.max(...rs),P=2*rmax+3.4;
  let pts,fl;
  if(shape<=1){pts=rs.map((r,i)=>[0,((n-1)/2-i)*P]);fl=shape===0?[rmax+5,pts[0][1]]:[0,pts[n-1][1]-rmax-4.5]}
  else if(shape===4){pts=rs.map((r,i)=>[i*P,0]);fl=[(n-1)*P+rmax+5,0]}
  else{
    const h=P/2;
    pts=n===1?[[0,0]]:n===2?[[-h,h],[-h,-h]]:n===3?[[-h,h],[-h,-h],[h,0]]:[[-h,h],[h,h],[-h,-h],[h,-h]];
    fl=n===1?[rmax+5,0]:n===2?[h+1,0]:n===3?[h,P*.8]:[0,0];
  }
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  const add=(x,y,r)=>{x0=Math.min(x0,x-r);x1=Math.max(x1,x+r);y0=Math.min(y0,y-r);y1=Math.max(y1,y+r)};
  pts.forEach((p,i)=>add(p[0],p[1],rs[i]+1.2));add(fl[0],fl[1],2.4);
  const ox=(x0+x1)/2,oy=(y0+y1)/2;
  pts=pts.map(p=>[p[0]-ox,p[1]-oy]);fl=[fl[0]-ox,fl[1]-oy];
  let mw=x1-x0+6,mh=y1-y0+6,mr=Math.min(mw,mh)/2*.55;
  if(shape===3){const rr=Math.max(...pts.map((p,i)=>Math.hypot(p[0],p[1])+rs[i]+1.2),Math.hypot(fl[0],fl[1])+2.4)+3;mw=mh=rr*2;mr=rr}
  if(shape===2){mw=mh=Math.max(mw,mh);mr=mw*.26}
  if(shape===4){mw=Math.max(W/k-2*mg,x1-x0+10);mr=mh/2;pts=pts.map(p=>[p[0]-(mw/2-(x1-x0)/2-5),p[1]]);fl=[fl[0]-(mw/2-(x1-x0)/2-5),fl[1]]}
  const fit=Math.min(1,(W-2*mg)/(mw*k),(H*.42)/(mh*k));k*=fit;
  mw*=k;mh*=k;
  const lx=shape===4?0:W/2-mg-mw/2,ly=H/2-mg-mh/2;
  let cx=shape===4?0:parts.camX==null?lx:clamp(parts.camX,-lx,lx);
  let cy=parts.camY==null?ly:clamp(parts.camY,-ly,ly);
  g.userData.lim={x:lx,y:ly,cx,cy};
  const bh=shape===0?0:[1,1.2,1.8,2.6,2.2][c];
  const z0=zb-bh;
  if(shape>0)g.add(mesh(slab(mw,mh,Math.min(mr*k,mw/2,mh/2),bh,Math.min(.6,bh*.35)),bumpMat,cx,cy,zb-bh/2));
  pts.forEach(([x,y],i)=>{
    const r=rs[i]*k,wx=cx-x*k,wy=cy+y*k;
    if(shape===0)g.add(mesh(disc(r+1.8,1),bumpMat,wx,wy,zb-.5));
    const zl=shape===0?zb-1:z0;
    if(peri&&i===n-1){
      g.add(mesh(slab(r*1.7+2,r*1.7+2,2,1.1,.3),ring,wx,wy,zl-.55));
      g.add(mesh(new T.BoxGeometry(r*1.7,r*1.7,.3),glass,wx,wy,zl-1.15));
    }else{
      g.add(mesh(disc(r+1.1,1.1),ring,wx,wy,zl-.55));
      g.add(mesh(disc(r,.3),glass,wx,wy,zl-1.15));
      g.add(mesh(disc(r*.45,.3),iris,wx,wy,zl-1.45));
    }
  });
  g.add(mesh(disc(2.2*k,.3),flash,cx-fl[0]*k,cy+fl[1]*k,(shape===0?zb:z0)-.1));
  G.add(g);G.userData.cam=g;
  return cy-mh/2;
}

function buildLaptop(parts){
  const g=new T.Group(),M=looks(parts),L=M.L;
  const W=304,Dd=213,R=[4,8,12][dv(parts,'corner')],TT=L.thick.mm.laptop,tb=TT*.62,tl=TT*.38;
  const fr=dv(parts,'frame')===0;
  const base=mesh(slab(W,Dd,R,tb,fr?Math.min(tb*.12,.8):tb*.4),M.body);base.rotation.x=-Math.PI/2;base.position.y=tb/2;g.add(base);

  const kz0=-Dd/2+24;
  const row=(cols,z,h)=>{let x=-pitch*15/2;cols.forEach(u=>{const w=u*pitch-(pitch-ks);g.add(mesh(new T.BoxGeometry(w,.6,h),km,x+w/2,tb+.2,z));x+=u*pitch})};
  row(Array(15).fill(1),kz0,9);
  for(let r=1;r<5;r++)row(r===1?Array(13).fill(1).concat([2]):r===2?[1.5].concat(Array(12).fill(1)).concat([1.5]):r===3?[1.8].concat(Array(11).fill(1)).concat([2.2]):[2.4].concat(Array(10).fill(1)).concat([2.6]),kz0+6+r*pitch-pitch/2,ks);
  row([1,1,1,1.3,5.4,1.3,1,1,1,1],kz0+6+5*pitch-pitch/2,ks);
  const tp=mesh(flat(122,76,5),phys(L.color[1],{metalness:L.finish[3].m,roughness:Math.min(.9,L.finish[3].r+.15)}),0,tb+.15,Dd/2-12-38);tp.rotation.x=-Math.PI/2;g.add(tp);
  const lid=new T.Group();lid.position.set(0,tb,-Dd/2+tl/2+1);lid.rotation.x=-0.3;g.add(lid);
  const LH=Dd-4;
  lid.add(mesh(slab(W,LH,R,tl,fr?Math.min(tl*.12,.5):tl*.4),M.body,0,LH/2,0));
  const bz=[[15,16,24],[10,11,17],[6.5,8,10],[4,5,6]][dv(parts,'bezel')];
  const mat=dv(parts,'glass')===1;
  lid.add(mesh(flat(W-2,LH-2,Math.max(1,R-1)),COVER(mat),0,LH/2,tl/2+.08));
  const dw=W-2*bz[0],dh=LH-bz[1]-bz[2];
  const dr=dv(parts,'bezel')>=2?Math.max(1,R-bz[0]):1;
  lid.add(mesh(flat(dw,dh,dr),screenTex(dw,dh,'desk'),0,bz[2]+dh/2,tl/2+.18));
  lid.add(mesh(flat(dw,dh,dr),SCREEN_FILM(mat),0,bz[2]+dh/2,tl/2+.22));
  const lens=phys('#141c30',{metalness:.6,roughness:.12});
  if(dv(parts,'fcam')===1){
    const top=bz[2]+dh;
    lid.add(mesh(flat(30,8,2.5),phys('#000000',{roughness:.25}),0,top-3,tl/2+.28));
    lid.add(mesh(disc(1.6,.2),lens,0,top-2.5,tl/2+.33));
    if(dv(parts,'face')===2)[-6,6].forEach(x=>lid.add(mesh(disc(1.1,.2),lens,x,top-2.5,tl/2+.33)));
  }else{
    lid.add(mesh(disc(1.6,.2),lens,0,LH-bz[1]/2,tl/2+.28));
    if(dv(parts,'face')===2)[-6,6].forEach(x=>lid.add(mesh(disc(1.1,.2),lens,x,LH-bz[1]/2,tl/2+.28)));
  }
  if(dv(parts,'fp')===2){
    const fk=mesh(disc(5,.3),phys('#2c2c30',{metalness:.3,roughness:.15,clearcoat:1}),-pitch*15/2+14*pitch+ks/2,tb+.6,kz0);fk.rotation.x=Math.PI/2;g.add(fk);
  }
  const port=(side,z,w,h)=>g.add(mesh(new T.BoxGeometry(1.2,h,w),DARK(),side*(W/2+.1),Math.min(tb/2,tb-h/2-.6),z));
  const pt=dv(parts,'port'),pz=-Dd/2+36;
  if(pt===0){port(-1,pz,12,Math.min(4.5,tb*.6));port(-1,pz+18,12,Math.min(4.5,tb*.6))}
  else if(pt===1){port(-1,pz,9,Math.min(3,tb*.5));port(-1,pz+14,9,Math.min(3,tb*.5))}
  else if(pt===2){port(-1,pz,9,Math.min(3,tb*.5));port(-1,pz+14,9,Math.min(3,tb*.5));port(1,pz,12,Math.min(4.5,tb*.6));port(1,pz+20,15,Math.min(5,tb*.65))}
  else{[0,1,2].forEach(i=>port(-1,pz+i*14,9,Math.min(3,tb*.5)));port(1,pz,15,Math.min(5,tb*.65));port(1,pz+24,24,Math.min(2,tb*.3))}
  if(dv(parts,'jack')===0){const j=mesh(new T.CylinderGeometry(1.8,1.8,1.4,24),DARK(),W/2+.1,Math.min(tb/2,tb-2.4),Dd/2-40);j.rotation.z=Math.PI/2;g.add(j)}
  return g;
}

function renderDesign(){
  const s=S.sel,T=TYPES[s.type];
  let h='<h2>製品を設計する</h2><div class="tabs">';
  Object.keys(TYPES).forEach(k=>{
    const t=TYPES[k];
    h+='<button class="tab '+(k===s.type?'on':'')+'" data-act="type" data-k="'+k+'">'+t.name+(S.owned[k]?'':'<small>参入 '+fmt(t.unlock)+'</small>')+'</button>';
  });
  h+='</div>';
  if(!S.owned[s.type]){
    h+='<p class="empty">この市場にはまだ参入していません。</p>';
    document.getElementById('design').innerHTML=h;updateModel();return;
  }
  const P=s.parts,mi=P.material||0,mul=SIZE_MUL[s.type],dt=S.ui.dtab||'parts';
  const sg=v=>(v>0?'+':'')+v;
  const info=(c,q)=>'原価 +'+yen(c)+(q?' / 性能 '+sg(q):'');
  h+='<div class="dtabs">'+DTABS.map(t=>'<button class="dtab '+(dt===t[0]?'on':'')+'" data-act="dtab" data-k="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
  if(dt==='parts'){
    CATS.forEach((c,i)=>{
      h+='<div class="row"><div class="lbl">'+c.name+'<span>重要度 '+Math.round(T.w[i]*100)+'%</span></div><div class="opts">';
      c.tiers.forEach((t,ti)=>{
        const locked=ti>S.unl[c.id];
        h+=optBtn(P[c.id]===ti,locked?'研究が必要':'','part',c.id,ti,t[0],'原価 '+yen(t[1])+' / 性能 '+t[2]);
      });
      h+='</div></div>';
    });
  }else{
    DTAB_KEYS[dt].forEach(k=>{
      if(k==='thick'){
        h+='<div class="row"><div class="lbl">薄さ</div><div class="opts">';
        THICK.forEach((t,ti)=>{h+=optBtn(P.thick===ti,dLock(s.type,P,'thick',ti),'look','thick',ti,t.name+' '+t.mm[s.type]+'mm',info(t.cost*mul,t.q))});
      }else if(k==='finish'){
        h+='<div class="row"><div class="lbl">質感<span>'+CATS[4].tiers[mi][0]+'</span></div><div class="opts">';
        FINISH[mi].forEach((f,fi)=>{h+=optBtn((P.finish||0)===fi,dLock(s.type,P,'finish',fi),'look','finish',fi,f[0],info(f[1],f[2]))});
      }else if(k==='color'){
        h+='<div class="row"><div class="lbl">色<span>'+CATS[4].tiers[mi][0]+'</span></div><div class="opts">';
        COLORS[mi].forEach((c,ci)=>{h+=optBtn((P.color||0)===ci,dLock(s.type,P,'color',ci),'look','color',ci,'<span class="sw" style="background:'+c[1]+'"></span>'+c[0],info(c[2],0))});
        const cn=COLORS[mi].length,cw=dLock(s.type,P,'color',cn);
        h+=optBtn(P.color===cn,cw,'look','color',cn,'<span class="sw" style="background:'+(P.ccol||'#8a8f98')+'"></span>カスタム',info(800,0));
        if(P.color===cn)h+='<label class="ccol">好きな色を選ぶ <input type="color" id="ccol" value="'+(P.ccol||'#8a8f98')+'"></label>';
      }else{
        if(!dKeys(s.type).includes(k))return;
        const D=DOPT[k],m=D.mul?mul:1;
        h+='<div class="row"><div class="lbl">'+D.name+'</div><div class="opts">';
        dOpts(s.type,k).forEach((o,oi)=>{h+=optBtn(dv(P,k)===oi,dLock(s.type,P,k,oi),'look',k,oi,o[0],info(o[1]*m,o[2]))});
      }
      h+='</div></div>';
    });
  }
  const q=quality(s.type,s.parts),uc=unitCost(s.type,s.parts);
  const lo=Math.ceil(uc*costMult()*1.05/1000)*1000,hi=Math.round(refPrice(q)*2/1000)*1000;
  if(!s.touched||!s.price)s.price=defaultPrice();
  h+='<div class="sum" id="sum"></div><p class="note" id="sumNote"></p>';
  h+='<div class="row"><div class="lbl">販売価格(好きな金額を入力できます) <span id="pv"></span></div>'+
     '<div class="pr"><input type="number" id="priceNum" min="1" step="1" value="'+s.price+'"><span>円</span></div>'+
     '<input type="range" id="price" min="'+lo+'" max="'+hi+'" step="1000" value="'+clamp(s.price,lo,hi)+'"></div>';
  h+='<div class="fl"><div><div class="lbl" style="font-size:13px;font-weight:700;margin-bottom:4px">製品名</div><input type="text" id="pname" maxlength="20" value="'+esc(T.pre+S.n)+'"></div>'+
     '<button class="go" data-act="dev">開発を始める</button></div>';
  document.getElementById('design').innerHTML=h;
  updateModel();
  document.getElementById('price').addEventListener('input',e=>{
    S.sel.price=+e.target.value;S.sel.touched=true;
    document.getElementById('priceNum').value=S.sel.price;updateSum();
  });
  updateSum();
}
function updateSum(){
  const el=document.getElementById('sum');if(!el)return;
  const s=S.sel,q=quality(s.type,s.parts),uc=unitCost(s.type,s.parts)*costMult();
  const an=techLv('analytics')>0;
  const margin=s.price-uc;
  let fc='<span class="lockt">未解禁</span>',rv=fc,note='予想は、研究タブの技術「市場分析」を完了すると使えるようになります。';
  if(an){
    const u=Math.round(demand({type:s.type,parts:s.parts,q,price:s.price,age:0,bugs:0},1));
    fc='約'+u.toLocaleString()+'台';
    rv=review(q,s.price).toFixed(1)+' / 10';
    note=u>cap()?'予想が生産能力('+cap()+'台/月)を超えています。研究タブの「生産ライン拡張」で増やせます。':'';
  }
  document.getElementById('pv').textContent=yen(s.price)+'(目安 '+yen(refPrice(q))+')';
  document.getElementById('sumNote').textContent=note;
  el.innerHTML=
   '<div><small>品質</small><b>'+q.toFixed(1)+'</b></div>'+
   '<div><small>1台の原価</small><b>'+yen(uc)+'</b></div>'+
   '<div><small>1台の利益</small><b class="'+(margin>=0?'pos':'neg')+'">'+yen(margin)+'</b></div>'+
   '<div><small>予想レビュー</small><b>'+rv+'</b></div>'+
   '<div><small>初月の予想販売</small><b>'+fc+'</b></div>'+
   '<div><small>開発費・期間</small><b>'+fmt(devCost(s.type,q))+' / '+TYPES[s.type].dev+'ヶ月</b></div>';
}

function starStr(n){return '★'.repeat(n)+'☆'.repeat(5-n)}
function renderRep(){
  let h='<h2>評判</h2><p class="note">発売した製品の評価やユーザーの声は、研究に関係なく誰でも見られます。ユーザー評価が10件以上たまると、口コミで売れ行きが最大20%増減します。</p>';
  if(!S.sales.length)h+='<p class="empty">販売中の製品がありません。</p>';
  S.sales.forEach(p=>{
    const avg=userAvg(p);
    h+='<div class="rep"><div class="dt"><b>'+esc(p.name)+'</b><span>'+TYPES[p.type].name+' ・ 品質 '+p.q.toFixed(0)+' ・ '+yen(p.price)+'</span></div>'+
      '<div class="kpis"><div><small>専門レビュー(発売時)</small><b>'+p.review.toFixed(1)+' / 10</b></div>'+
      '<div><small>ユーザー評価</small><b>'+(p.rvN?'★ '+avg.toFixed(1)+'('+p.rvN+'件)':'まだありません')+'</b></div>'+
      '<div><small>ユーザー数</small><b>'+Math.round(p.total).toLocaleString()+'人</b></div>'+
      '<div><small>バグ</small><b>'+p.bugs+'件</b></div></div>';
    if(p.rvN){
      h+='<div class="sub2">評価の内訳</div>';
      for(let i=5;i>=1;i--){const c=p.stars[i-1];h+='<div class="rb"><u>★'+i+'</u><i><b style="width:'+(c/p.rvN*100)+'%"></b></i><em>'+c+'</em></div>'}
      h+='<div class="sub2">最近のユーザーの声</div>';
      p.rvs.slice(0,5).forEach(r=>{h+='<div class="cm"><span class="st">'+starStr(r.s)+'</span> '+esc(r.t)+'<small>'+esc(r.n)+'</small></div>'});
    }
    h+='</div>';
  });
  if(S.retired.length){
    h+='<div class="sub2">販売を終了した製品</div>';
    S.retired.slice(0,10).forEach(r=>{h+='<div class="res"><span>'+esc(r.name)+'<small>'+TYPES[r.type].name+' ・ 専門 '+r.review.toFixed(1)+' ・ ユーザー評価 '+(r.n?'★'+r.avg.toFixed(1)+'('+r.n+'件)':'-')+'</small></span><b>'+r.total.toLocaleString()+'人</b></div>'});
  }
  setIf('repBox',h);
}
function renderLog(){
  let h='<h2>ニュース</h2><div class="log">';
  if(!S.log.length)h+='<p class="empty">ここに出来事が出ます。</p>';
  S.log.forEach(l=>{h+='<p><b>'+dayLabel(l.d)+'</b>'+esc(l.t)+'</p>'});
  setIf('logBox',h+'</div>');
}

function renderLive(){updateBar();renderNav();renderHome();renderSales();renderMarket();renderResearch();renderOffice();renderRep();renderLog();updateSum()}
function renderAll(){checkGoals();renderLive();renderDesign()}

const THEME_KEY='device-tycoon-theme';
const THEMES=[['auto','自動(OSに合わせる)'],['light','ライト'],['dark','ダーク']];
function getTheme(){try{return localStorage.getItem(THEME_KEY)||'auto'}catch(e){return 'auto'}}
function applyTheme(t){
  if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;
  else delete document.documentElement.dataset.theme;
}
function setTheme(t){try{localStorage.setItem(THEME_KEY,t)}catch(e){}applyTheme(t)}
function titleData(d){
  if(!(d&&d.name))return '<h2>会社データ</h2><p class="empty">セーブデータはありません。</p>';
  const kv=(k,v)=>'<div class="kv"><span>'+k+'</span><b>'+v+'</b></div>';
  const o=OFFICES[d.office||0];
  return '<h2>会社データ</h2>'+
    kv('会社名',esc(d.name))+kv('ランク',o.rank)+kv('日付',dayLabel(d.day||0))+
    kv('資金',fmt(d.money||0))+kv('ユーザー数',(d.totalUnits||0).toLocaleString()+'人')+
    kv('ファン',Math.round(d.fans||0).toLocaleString()+'人')+kv('発売した製品',d.released||0)+
    kv('目標',GOALS.filter(g=>d.goals&&d.goals[g.id]).length+' / '+GOALS.length)+
    (d.over?kv('状態','<span class="neg">倒産</span>'):'');
}
function showTitle(mode){
  setPlaying(false);
  const d=peek(),m=document.getElementById('tmenu');
  document.getElementById('tdata').innerHTML=titleData(d);
  if(mode==='name'){
    m.innerHTML='<label for="cname">会社名を決めてください</label><input type="text" id="cname" maxlength="16" placeholder="例: ミライデバイス">'+
      '<button class="go big" data-act="start">ゲームスタート</button><button class="go alt" data-act="title">もどる</button>';
    setTimeout(()=>{const i=document.getElementById('cname');if(i)i.focus()},30);
  }else if(mode==='settings'){
    const cur=getTheme();
    m.innerHTML='<label>テーマ</label>'+THEMES.map(t=>'<button class="opt '+(cur===t[0]?'on':'')+'" data-act="theme" data-k="'+t[0]+'">'+t[1]+'</button>').join('')+
      '<label>セーブデータ</label>'+
      '<button class="go alt" data-act="export"'+(d&&d.name?'':' disabled')+'>ファイルに書き出す</button>'+
      '<button class="go alt" data-act="import">ファイルから読み込む</button><input type="file" id="importFile" accept=".json,application/json" hidden>'+
      '<button class="go alt" data-act="title">もどる</button>';
  }else{
    m.innerHTML=(d&&d.name?'<button class="go big" data-act="cont">つづきから</button>':'')+
      '<button class="go '+(d&&d.name?'alt':'big')+'" data-act="new">はじめから</button>'+
      '<button class="go alt" data-act="settings">設定</button>';
  }
  document.getElementById('title').classList.add('on');
}
function exportSave(){
  save();const d=peek();if(!d)return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));
  a.download='スマホ帝国-'+String(d.name).replace(/[\\/:*?"<>|]/g,'')+'-'+(Math.floor((d.day||0)/360)+1)+'年目.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importSave(file){
  const r=new FileReader();
  r.onload=()=>{
    let d=null;try{d=JSON.parse(r.result)}catch(e){}
    if(!d||typeof d!=='object'||!d.name||typeof d.day!=='number'||!d.sel){toast('セーブデータのファイルではありません');return}
    if(peek()&&!confirm('いまのセーブデータを「'+d.name+'」のデータで上書きします。よろしいですか?'))return;
    try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){toast('読み込めませんでした');return}
    inGame=false;toast('「'+d.name+'」のセーブデータを読み込みました');showTitle('settings');
  };
  r.readAsText(file);
}
function hideTitle(){document.getElementById('title').classList.remove('on')}
function startNew(){
  const i=document.getElementById('cname');
  const name=(i&&i.value.trim())||'ノーネーム社';
  S=fresh(name);newCands();inGame=true;addLog('「'+name+'」を設立。最初の製品を作ろう');save();hideTitle();renderAll();
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='cname'){startNew();return}
  if(e.code==='Space'&&!/INPUT|TEXTAREA|BUTTON/.test(e.target.tagName)){
    if(document.getElementById('title').classList.contains('on')||document.getElementById('modal').classList.contains('on'))return;
    e.preventDefault();setPlaying(!playing);
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='ccol'){S.sel.parts.ccol=e.target.value;updateModel();const sw=document.querySelector('[data-c=color].on .sw');if(sw)sw.style.background=e.target.value;return}
  if(e.target.id!=='priceNum')return;
  const v=Math.round(+e.target.value);
  if(!(v>=1))return;
  S.sel.price=Math.min(v,1e9);S.sel.touched=true;
  const sl=document.getElementById('price');
  if(sl)sl.value=clamp(S.sel.price,+sl.min,+sl.max);
  updateSum();
});
document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0]){importSave(e.target.files[0]);e.target.value=''}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)setPlaying(false)});
window.addEventListener('beforeunload',()=>{save()});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==='close'){document.getElementById('modal').classList.remove('on');return}
  if(a==='title'){save();showTitle('menu');return}
  if(a==='new'){
    if(peek()&&!confirm('いまのセーブデータは消えます。はじめからにしますか?'))return;
    showTitle('name');return;
  }
  if(a==='start'){startNew();return}
  if(a==='settings'){showTitle('settings');return}
  if(a==='export'){exportSave();return}
  if(a==='import'){document.getElementById('importFile').click();return}
  if(a==='theme'){setTheme(b.dataset.k);showTitle('settings');return}
  if(a==='cont'){const d=peek();if(d){S=merge(d);if(!S.cands.length)newCands();normalizeDesign(S.sel.type,S.sel.parts);inGame=true;hideTitle();renderAll()}return}
  if(a==='play'){setPlaying(!playing);return}
  if(a==='speed'){S.speed=+b.dataset.v;schedule();updateBar();save();return}
  if(a==='tab'){S.ui.tab=b.dataset.k;save();renderNav();window.scrollTo(0,0);return}
  if(a==='vedit'){V.edit=!V.edit;V.selBtn=null;V.key='';updateModel();renderVtools();return}
  if(a==='vside'){
    const P=S.sel.parts,bl=btnList(S.sel.type,P),b=bl[V.selBtn];if(!b)return;
    b.s=e.target.closest('[data-k]').dataset.k;b.p=0;P.btns=bl;V.key='';renderDesign();return;
  }
  if(a==='dtab'){S.ui.dtab=b.dataset.k;renderDesign();return}
  if(a==='rtab'){S.ui.rtab=b.dataset.k;save();renderResearch();return}
  if(a==='restart'){const n=S.name;S=fresh(n);addLog('「'+n+'」を再スタート');save();renderAll();return}
  if(S.over)return;
  if(a==='type'){
    const k=b.dataset.k,t=TYPES[k];
    if(!S.owned[k]){
      if(S.money<t.unlock){toast('資金が足りません(必要 '+fmt(t.unlock)+')');return}
      if(!confirm(t.name+'市場に参入します。'+fmt(t.unlock)+'かかります。よろしいですか?'))return;
      S.money-=t.unlock;S.owned[k]=true;addLog(t.name+'市場に参入');
    }
    if(S.sel.type!==k){delete S.sel.parts.btns;delete S.sel.parts.camX;delete S.sel.parts.camY;V.selBtn=null}
    S.sel.type=k;normalizeDesign(k,S.sel.parts);S.sel.touched=false;save();renderAll();return;
  }
  if(a==='part'){
    const P=S.sel.parts;P[b.dataset.c]=+b.dataset.t;
    if(b.dataset.c==='material'){P.finish=0;P.color=0;if(P.material===0&&THICK[P.thick].metal)P.thick=2}
    normalizeDesign(S.sel.type,P);S.sel.touched=false;renderDesign();return}
  if(a==='look'){S.sel.parts[b.dataset.c]=+b.dataset.t;normalizeDesign(S.sel.type,S.sel.parts);S.sel.touched=false;renderDesign();return}
  if(a==='dev'){
    if(S.dev.length>=office().dev){toast('同時開発の上限です。オフィスを大きくすると増やせます');return}
    const s=S.sel,q=quality(s.type,s.parts),cost=devCost(s.type,q);
    if(!(s.price>=1)){toast('販売価格を1円以上で入力してください');return}
    if(S.money<cost){toast('開発費が足りません(必要 '+fmt(cost)+')');return}
    const name=(document.getElementById('pname').value.trim()||TYPES[s.type].pre+S.n).slice(0,20);
    const days=TYPES[s.type].dev*30;
    S.money-=cost;
    S.dev.push({id:S.n,name,type:s.type,parts:JSON.parse(JSON.stringify(s.parts)),q,price:s.price,cost:unitCost(s.type,s.parts),
      total:days,left:days,score:0,bugs:0,target:devTarget(q)});
    addLog('「'+name+'」の開発を開始(開発費 '+fmt(cost)+')');
    S.n++;S.sel.touched=false;save();renderAll();toast('開発を始めました。再生で日が進みます');return;
  }
  if(a==='debug'){
    const d=S.dev.find(x=>String(x.id)===b.dataset.id);if(!d)return;
    const n=Math.min(5,d.bugs);if(n<=0)return;
    const cost=n*bugCost(d.q);
    if(S.money<cost){toast('デバッグ費用が足りません(必要 '+fmt(cost)+')');return}
    S.money-=cost;d.bugs-=n;
    addLog('「'+d.name+'」のバグを'+n+'件修正(費用 '+fmt(cost)+')');
    renderLive();return;
  }
  if(a==='res'){
    if(S.research.length>=office().res)return;
    const id=b.dataset.id;let item;
    if(b.dataset.kind==='part'){
      const c=CATS.find(x=>x.id===id),nt=S.unl[id]+1,m=resMonths(nt)*30;
      if(S.rp<rpCost(RC[nt]))return;
      S.rp-=rpCost(RC[nt]);
      item={kind:'part',key:'part:'+id,cat:id,tier:nt,name:c.name+'「'+c.tiers[nt][0]+'」',total:m,left:m};
    }else{
      const x=TECH.find(t=>t.id===id),lv=techLv(id)+1,nx=x.lv[lv-1],m=resMonths(nx[1])*30;
      if(S.rp<rpCost(nx[0]))return;
      S.rp-=rpCost(nx[0]);
      item={kind:'tech',key:'tech:'+id,id,lv,name:x.name+(x.lv.length>1?' Lv'+lv:''),total:m,left:m};
    }
    S.research.push(item);addLog('研究開始: '+item.name);
    save();renderAll();return;
  }
  if(a==='rename'){
    const v=document.getElementById('rename').value.trim().slice(0,16);
    if(!v){toast('社名を入力してください');return}
    if(v===S.name){toast('今と同じ社名です');return}
    if(S.money<RENAME_COST){toast('資金が足りません(必要 '+fmt(RENAME_COST)+')');return}
    if(!confirm('社名を「'+v+'」に変更します。'+fmt(RENAME_COST)+'かかります。よろしいですか?'))return;
    const old=S.name;S.money-=RENAME_COST;S.name=v;
    const boss=S.staff.find(p=>p.boss);if(boss)boss.name=v+'の社長(あなた)';
    addLog('社名を「'+old+'」から「'+v+'」に変更');toast('社名を「'+v+'」に変更しました');
    save();renderAll();return;
  }
  if(a==='hire'){
    const c=S.cands.find(x=>String(x.id)===b.dataset.id);if(!c)return;
    if(S.staff.length>=staffCap()){toast('オフィスの定員です。大きなオフィスに移転すると増やせます');return}
    S.cands=S.cands.filter(x=>x!==c);S.staff.push(c);
    addLog(c.name+'さんを採用(スコア '+c.score+' / 月給 '+fmt(c.sal)+')');
    save();renderAll();return;
  }
  if(a==='fire'){
    const p=S.staff.find(x=>String(x.id)===b.dataset.id);if(!p||p.boss)return;
    if(!confirm(p.name+'さんを解雇しますか?'))return;
    S.staff=S.staff.filter(x=>x!==p);addLog(p.name+'さんが退職');
    save();renderAll();return;
  }
  if(a==='office'){
    const nx=OFFICES[S.office+1];if(!nx||S.money<nx.cost)return;
    S.money-=nx.cost;S.office++;addLog(nx.name+'へ移転');
    save();renderAll();toast(nx.name+'に移転しました');return;
  }
  if(a==='fac'){
    const f=FAC.find(x=>x.id===b.dataset.id),lv=S.fac[f.id];
    if(lv>=f.cost.length||S.money<f.cost[lv])return;
    S.money-=f.cost[lv];S.fac[f.id]++;addLog(f.name+'を増設(Lv'+S.fac[f.id]+')');
    save();renderAll();
  }
});

applyTheme(getTheme());
document.getElementById('ver').textContent='v'+VERSION;
S=fresh();
renderBar();
renderAll();
showTitle('menu');
</script>
</body>
